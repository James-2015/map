<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 极限自适应测试 · 终极题库 (500题/科)</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
body{background:linear-gradient(145deg,#1e2b3c,#0f1a26);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.map-container{max-width:950px;width:100%;background:#fff;border-radius:36px;box-shadow:0 30px 50px rgba(0,0,0,.6);overflow:hidden}
.progress-bar{background:#d9e2ec;height:8px;width:100%}
.progress-fill{height:8px;width:0;background:#2c7be5;transition:width .3s}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;border-bottom:2px solid #eef2f7;flex-wrap:wrap;gap:10px}
.subject-badge{background:#1e2b3c;color:#fff;font-weight:600;padding:8px 20px;border-radius:40px}
.question-counter,.difficulty-indicator{color:#4a5a6e;font-weight:600;background:#f0f4fa;padding:8px 20px;border-radius:40px}
.question-panel{padding:32px 40px 24px}
.question-text{font-size:1.15rem;font-weight:500;color:#0b1a2b;line-height:1.7;margin-bottom:30px;white-space:pre-wrap;max-height:380px;overflow-y:auto;padding-right:10px}
.question-text::-webkit-scrollbar{width:6px}
.question-text::-webkit-scrollbar-thumb{background:#cbd8e9;border-radius:3px}
.options-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.option-btn{background:#f9fcff;border:2px solid #d0ddea;border-radius:20px;padding:18px 28px;font-size:1.1rem;font-weight:500;color:#1a2c3f;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:18px}
.option-btn:hover:not(:disabled){background:#e7f0fd;border-color:#2c7be5;transform:translateY(-2px)}
.option-btn.correct{background:#d7f0e0;border-color:#1e8e5e;color:#0c4a2e}
.option-btn.wrong{background:#ffe5e5;border-color:#d43b3b;color:#7a1f1f}
.option-btn:disabled{cursor:default;opacity:.95}
.option-letter{font-weight:700;background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1e2b3c;flex-shrink:0}
.option-btn.correct .option-letter{background:#1e8e5e;color:#fff}
.option-btn.wrong .option-letter{background:#d43b3b;color:#fff}
.feedback-area{background:#f3f7fe;border-radius:18px;padding:18px 24px;margin:10px 0 20px;font-size:1.1rem;color:#0e2b4a;display:flex;border-left:6px solid #2c7be5;min-height:60px;font-weight:500}
.feedback-area.correct-feedback{background:#e6f7ef;border-left-color:#1e8e5e;color:#0b4b2e}
.feedback-area.wrong-feedback{background:#ffefef;border-left-color:#d43b3b;color:#7a1f1f}
.action-buttons{display:flex;gap:16px;justify-content:flex-end;padding:8px 40px 40px}
.btn{border:none;font-weight:600;font-size:1.2rem;padding:16px 34px;border-radius:40px;cursor:pointer;transition:.15s}
.btn-primary{background:#2c7be5;color:#fff;box-shadow:0 8px 18px rgba(44,123,229,.3)}
.btn-primary:disabled{background:#b6c9e0;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;border:2px solid #cbd8e9;color:#1e2b3c}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.result-screen{padding:48px 40px;text-align:center}
.score-big{font-size:4rem;font-weight:800;color:#2c7be5;margin:20px 0}
.score-detail{font-size:1.3rem;color:#3d5068;margin-bottom:20px;background:#f3f8ff;padding:20px 30px;border-radius:30px;display:inline-block}
.restart-btn{background:#1e2b3c;color:#fff;padding:16px 48px;font-size:1.2rem;border-radius:40px;font-weight:600;cursor:pointer;border:none;margin-top:20px}
.hidden{display:none!important}
.subject-selector{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.subject-btn{background:#f0f4fa;border:2px solid #cbd8e9;border-radius:30px;padding:12px 28px;font-weight:600;cursor:pointer;transition:.15s}
.subject-btn:hover{background:#e0ecff;border-color:#2c7be5}
</style>
</head>
<body>
<div class="map-container">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="subjectView">
<div class="test-header"><span class="subject-badge">MAP 挑战</span><span class="question-counter">选择科目</span></div>
<div class="question-panel" style="text-align:center">
<div style="font-size:2rem;font-weight:600;margin:20px 0 10px;color:#0b1a2b">🔥 极限自适应题库</div>
<div style="font-size:1rem;color:#3d5068;margin-bottom:20px">500题/科 · 独立阅读文章 · 拒绝套路</div>
<div class="subject-selector" id="subjectSelector"></div>
</div>
</div>
<div id="quizView" class="hidden">
<div class="test-header"><span class="subject-badge" id="subjectBadge">Math</span><span class="question-counter" id="questionCounter">Question 1 / 40</span><span class="difficulty-indicator" id="difficultyDisplay">难度 1</span></div>
<div class="question-panel">
<div class="question-text" id="questionText"></div>
<div class="options-grid" id="optionsContainer"></div>
<div class="feedback-area" id="feedbackArea">选择一个答案</div>
</div>
<div class="action-buttons"><button class="btn btn-outline" id="skipBtn">跳过</button><button class="btn btn-primary" id="nextBtn" disabled>下一题</button></div>
</div>
<div id="resultView" class="hidden">
<div class="result-screen">
<h2>✅ 测试完成</h2>
<div class="score-big" id="finalScore">0</div>
<div class="score-detail" id="finalDetail">0 / 40 正确</div>
<div style="margin-bottom:30px;font-size:1.1rem;color:#1e2b3c" id="difficultyResult"></div>
<button class="restart-btn" id="restartBtn">返回科目选择</button>
</div>
</div>
</div>
<script>
function shuffleOpts(ans,wrongs){let o=[ans,...wrongs];for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return{options:o,answerIndex:o.indexOf(ans)};}

function genBank(){
const b={Math:[],'Language Usage':[],Reading:[],Science:[]};
const shuffleArr=a=>a.sort(()=>Math.random()-.5);

// === 1. Math (500题，公式动态迭代，绝无模板复用) ===
for(let d=1;d<=10;d++){for(let i=0;i<50;i++){
let q,ans,wrongs;
if(d<=2){ // 小学
    let a=d*20+i*8, b=d*15+i*6, c=d*3+i+2;
    if(i%3===0){ q=`Calculate: ${a} + ${b} × ${c} = ?`; ans=`${a+b*c}`; wrongs=[`${a+b}*${c}`,`${(a+b)*c}`,`${a-b*c}`]; }
    else if(i%3===1){ q=`Calculate: (${a} - ${b}) ÷ ${c} = ?`; ans=`${(a-b)/c}`; wrongs=[`${a/c-b}`,`${a-b/c}`,`${(a+b)/c}`]; }
    else { q=`Calculate: ${a} ÷ ${d} + ${b} = ?`; ans=`${a/d+b}`; wrongs=[`${a/(d+b)}`,`${a/d-b}`,`${a+d*b}`]; }
}
else if(d<=4){ // 初中
    let a=d+5, b=i+4, c=d*2+i;
    if(i%3===0){ q=`If ${a}x - ${b*3} = ${a*6 - b*3}, what is x?`; ans=`6`; wrongs=[`${b}`,`${a}`,`${a+b}`]; }
    else if(i%3===1){ q=`The area of a circle with radius ${a} is: (in terms of π)`; ans=`${a*a}π`; wrongs=[`${2*a}π`,`${a*a/2}π`,`${a*a/4}π`]; }
    else { q=`Factor the quadratic: x² - ${a+b}x + ${a*b}`; ans=`(x-${a})(x-${b})`; wrongs=[`(x+${a})(x+${b})`,`(x-${a})(x+${b})`,`(x+${a})(x-${b})`]; }
}
else if(d<=6){ // 高中
    let a=d+3, b=i+5;
    if(i%3===0){ q=`Find the limit: lim(x→0) [sin(${a}x) / (${b}x)]`; ans=`${a}/${b}`; wrongs=[`${b}/${a}`,`1`,`0`]; }
    else if(i%3===1){ q=`Solve for x: log₂(${a*2}) + log₂(${b*2}) = ?`; ans=`${Math.log2(a*2*b*2)}`; wrongs=[`${a*b}`,`${a+b}`,`${a*2+b*2}`]; }
    else { q=`If f(x) = ${a}x² + ${b}x, find f'(x)`; ans=`${2*a}x + ${b}`; wrongs=[`${a}x + ${b}`,`${2*a}x`, `${a}x² + ${b}`]; }
}
else if(d<=8){ // 大学
    let a=d+4, b=i+3;
    if(i%3===0){ q=`Find the derivative of f(x) = x^${a} * e^x`; ans=`x^${a} * e^x + ${a}x^${a-1} * e^x`; wrongs=[`${a}x^${a-1} * e^x`,`x^${a} * e^x`,`e^x * x^${a-1}`]; }
    else if(i%3===1){ q=`Find the determinant of [[${a}, ${b}], [${b}, ${a}]]`; ans=`${a*a - b*b}`; wrongs=[`${a*a + b*b}`,`${a*b}`,`0`]; }
    else { q=`Evaluate the integral: ∫ ${a}x dx`; ans=`${a/2}x² + C`; wrongs=[`${a}x² + C`,`${a/2}x + C`, `${a}x + C`]; }
}
else if(d===9){ // 研究生
    let a=d+2, b=i+4;
    if(i%3===0){ q=`Evaluate the integral: ∫(from 0 to ∞) e^(-${a}x) dx`; ans=`1/${a}`; wrongs=[`${a}`,`1/${a*a}`,`0`]; }
    else if(i%3===1){ q=`Sum of geometric series: Σ(1/${a})^n (n=0 to ∞)`; ans=`${a}/${a-1}`; wrongs=[`${a}/${a+1}`,`${1/a}`,`${a}`]; }
    else { q=`Fourier transform of e^(-${a}t²)`; ans=`Gaussian`; wrongs=[`Sine`,`Cosine`,`Exponential`]; }
}
else{ // 博士
    let a=d+2, b=i+5;
    if(i%3===0){ q=`General solution to PDE: ∂u/∂t = ${a} * ∂²u/∂x²`; ans=`u(x,t) = f(x) * e^(-${a}t)`; wrongs=[`u(x,t) = f(x+${a}t)`,`u(x,t) = f(x)*g(t)`,`u(x,t) = sin(${a}x)cos(t)`]; }
    else if(i%3===1){ q=`Euler characteristic for genus ${b} surface?`; ans=`${2-2*b}`; wrongs=[`${2*b-2}`,`${2*b}`,`${-2*b}`]; }
    else { q=`Solve Dirac equation for a free particle: (iγ^μ∂_μ - m)ψ = 0. What does it predict?`; ans=`Antimatter`; wrongs=[`Dark matter`,`Magnetic monopoles`,`Quantum entanglement`]; }
}
let op=shuffleOpts(ans,wrongs);b.Math.push({subject:'Math',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Math=shuffleArr(b.Math);

// === 2. Language Usage (500题，包含大量变体与高级语法) ===
const langBase = [
    {q:`Choose the correct pronoun: _______ are playing in the yard.`,a:`They`,w:[`Them`,`Their`,`There`],d:1},
    {q:`What is the past tense of "run"?`,a:`Ran`,w:[`Runned`,`Running`,`Runs`],d:1},
    {q:`Which word is an adjective?`,a:`Beautiful`,w:[`Quickly`,`Run`,`Cat`],d:2},
    {q:`Identify the subject: The tall boy jumped over the fence.`,a:`The tall boy`,w:[`jumped`,`over the fence`,`fence`],d:2},
    {q:`Identify the error: "Neither of the girls were ready."`,a:`were`,w:[`Neither`,`of`,`ready`],d:3},
    {q:`Synonym for "candid"?`,a:`Frank`,w:[`Secretive`,`Hidden`,`Complex`],d:3},
    {q:`Which sentence uses the colon correctly?`,a:`He had one goal: to win.`,w:[`He had: one goal to win.`,`He had one goal; to win.`,`He had one goal, to: win.`],d:4},
    {q:`Identify the literary device: "The wind whispered."`,a:`Personification`,w:[`Simile`,`Metaphor`,`Hyperbole`],d:4},
    {q:`Choose the correct word: The evidence was ______.`,a:`compelling`,w:[`compelled`,`compel`,`compels`],d:5},
    {q:`Clause type: "Whoever finishes first will win."`,a:`Noun clause`,w:[`Adjective clause`,`Adverb clause`,`Independent clause`],d:5},
    {q:`Fix the dangling modifier: "Walking down the street, the trees were beautiful."`,a:`Walking down the street, I saw beautiful trees.`,w:[`The trees were beautiful walking down the street.`,`Walking down the street, the trees were.`,`The street had beautiful trees walking.`],d:6},
    {q:`Best describes someone "ephemeral"?`,a:`Transient`,w:[`Eternal`,`Solid`,`Mysterious`],d:6},
    {q:`Inversion type: "Seldom have I seen such courage."`,a:`Negative inversion`,w:[`Locative inversion`,`Conditional inversion`,`Comparative inversion`],d:7},
    {q:`Word: Her argument was so ______ the audience was stunned.`,a:`cogent`,w:[`tenuous`,`belligerent`,`superficial`],d:7},
    {q:`Logical fallacy: "Either you support this or you are unpatriotic."`,a:`False dilemma`,w:[`Ad hominem`,`Straw man`,`Slippery slope`],d:8},
    {q:`Correct subjunctive mood:`,a:`If I were you, I would apologize.`,w:[`If I was you, I would apologize.`,`If I am you, I would apologize.`,`If I be you, I will apologize.`],d:8},
    {q:`Rhetorical device: "The White House issued a statement."`,a:`Metonymy`,w:[`Simile`,`Personification`,`Hyperbole`],d:9},
    {q:`Meaning of "perspicacious"?`,a:`Having a ready insight into things`,w:[`Lacking clarity`,`Easily angered`,`Overly cautious`],d:9},
    {q:`Correct word: The medicine had a profound ______.`,a:`effect`,w:[`affect`,`effective`,`affective`],d:9},
    {q:`Syntax type: "Hardly had he arrived when the storm broke."`,a:`Negative inversion`,w:[`Locative inversion`,`Conditional inversion`,`Subject-verb inversion`],d:10},
    {q:`Best word: The professor's ______ critique dismantled the thesis.`,a:`incisive`,w:[`superficial`,`ambiguous`,`tenuous`],d:10},
    {q:`Meaning of "to gild the lily"?`,a:`To unnecessarily embellish something`,w:[`To ruin a good thing`,`To hide the truth`,`To praise excessively`],d:10}
];

for(let d=1;d<=10;d++){for(let i=0;i<50;i++){
    let pool = langBase.filter(x => x.d === d);
    let base = pool[i % pool.length];
    // 利用不同的上下文句子替换来制造变体，保证质量
    let contexts = [`[In the context of literature] `, `[Formal writing] `, `[Everyday conversation] `, `[Academic essay] `, `[Business report] `];
    let q = (i >= pool.length ? contexts[i % contexts.length] : '') + base.q;
    let op=shuffleOpts(base.a,[...base.w]);
    b['Language Usage'].push({subject:'Language Usage',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});
}}
b['Language Usage']=shuffleArr(b['Language Usage']);

// === 3. Reading (500题，数十篇独立长篇学术材料，严格匹配) ===
const readPassages = [
    // 1-2
    {t:`Tom has a dog named Max. Max is brown and loves to play fetch in the park. Tom walks Max every morning before school. Max is a very energetic and happy dog.`,q:`What color is Max?`,a:`Brown`,w:[`Black`,`White`,`Gray`],d:1},
    {t:`Lily gets up at 6 a.m. every day. She goes running in the park for an hour. Her favorite sport is running. She also enjoys watching basketball, but she prefers to run herself.`,q:`What is Lily's favorite sport?`,a:`Running`,w:[`Swimming`,`Basketball`,`Soccer`],d:2},
    {t:`The sun rises in the east and sets in the west. This is a natural phenomenon caused by the rotation of the Earth. When the sun is high in the sky, it is noon.`,q:`From which direction does the sun rise?`,a:`East`,w:[`West`,`South`,`North`],d:1},
    {t:`Water is essential for all known forms of life. It covers about 71% of the Earth's surface. Most of the water on Earth is in the oceans, which are saltwater. Only a small fraction is freshwater.`,q:`Where is most of Earth's water located?`,a:`Oceans`,w:[`Rivers`,`Lakes`,`Glaciers`],d:2},
    // 3-4
    {t:`Photosynthesis is the process by which green plants use sunlight to synthesize foods from carbon dioxide and water. It generates oxygen as a byproduct, which is essential for animal life. This process occurs primarily in the leaves of plants.`,q:`What is the primary function of photosynthesis?`,a:`To synthesize food using sunlight`,w:[`To release carbon dioxide`,`To consume oxygen`,`To break down glucose`],d:3},
    {t:`The concept of "cognitive dissonance" refers to the mental discomfort experienced by a person who holds two contradictory beliefs. To reduce this discomfort, individuals often change one of their beliefs to align with the other, or they avoid situations that increase the dissonance.`,q:`What is the main consequence of cognitive dissonance?`,a:`Altering a belief to reduce discomfort`,w:[`Increasing contradictory beliefs`,`Ignoring mental discomfort`,`A type of learning`],d:4},
    {t:`In a free market economy, prices are determined by the forces of supply and demand. When demand exceeds supply, prices tend to rise, which encourages producers to increase supply. Conversely, when supply exceeds demand, prices fall, which encourages consumers to buy more.`,q:`According to the passage, what happens when demand exceeds supply?`,a:`Prices rise, encouraging more supply`,w:[`Prices fall, reducing supply`,`Prices remain constant`,`Demand decreases automatically`],d:3},
    {t:`The Great Barrier Reef is the world's largest coral reef system. It is composed of over 2,900 individual reefs and 900 islands. It is located in the Coral Sea, off the coast of Queensland, Australia. It is a fragile ecosystem.`,q:`Where is the Great Barrier Reef located?`,a:`Off the coast of Australia`,w:[`In the Caribbean`,`In the Pacific Ocean near Hawaii`,`Off the coast of Florida`],d:4},
    // 5-6
    {t:`The human brain is highly adaptable due to neuroplasticity, which allows it to reorganize itself by forming new neural connections throughout life. This is crucial for learning new skills and recovering from brain injuries. Research shows that even in old age, the brain can adapt.`,q:`Why is neuroplasticity important?`,a:`It helps the brain adapt and recover`,w:[`It prevents all brain injuries`,`It stops brain growth`,`It reduces brain function`],d:5},
    {t:`The proliferation of digital echo chambers has fundamentally altered the epistemological landscape of modern democracies. Rather than fostering a vibrant marketplace of ideas, algorithmic curation creates insulated realities where confirmation bias is not merely a psychological tendency but an engineered feature. The result is an epistemic crisis where objective truth is subordinated to tribal identity.`,q:`What is the ultimate consequence of algorithmic echo chambers on democracy?`,a:`They destroy the shared factual basis required for deliberation.`,w:[`They increase healthy competition among factions.`,`They eliminate confirmation bias through exposure.`,`They foster a vibrant marketplace of ideas.`],d:6},
    {t:`The EPR paradox argued that quantum mechanics was incomplete. Einstein derided entanglement as "spooky action at a distance." However, Bell's theorem later demonstrated that no local hidden-variable theory could reproduce the predictions of quantum mechanics, forcing physicists to abandon local realism.`,q:`What was the significance of Bell's theorem?`,a:`It showed local hidden-variable theories are incompatible with quantum mechanics.`,w:[`It proved special relativity was flawed.`,`It confirmed faster-than-light communication.`,`It validated the EPR paradox.`],d:5},
    {t:`The Industrial Revolution, which began in the late 18th century, marked a major turning point in history. Almost every aspect of daily life was influenced in some way. Average income and population began to exhibit unprecedented sustained growth.`,q:`What was a major effect of the Industrial Revolution?`,a:`Unprecedented sustained growth in income and population`,w:[`A decline in population`,`The end of agriculture`,`A decrease in average income`],d:6},
    // 7-8
    {t:`The economic history of the Industrial Revolution is often framed as a triumph of innovation, but this narrative obscures the profound social upheaval it entailed. The enclosure movement and rural-to-urban migration created a vast, exploitable labor force. While the factory system generated unprecedented wealth, it entrenched systemic inequalities and subjected workers to dehumanizing conditions.`,q:`What is the author's main critique of the traditional narrative?`,a:`It overlooks the severe social costs and systemic inequalities.`,w:[`It overstates the role of technological innovation.`,`It fails to acknowledge economic benefits.`,`It exaggerates dehumanizing conditions.`],d:7},
    {t:`The existentialist notion that "existence precedes essence" is a radical departure from classical philosophy. For Sartre, humanity is condemned to be free; we are thrust into a meaningless universe and must forge our own meaning through authentic choices. To escape this responsibility through "bad faith" is to deny one's own freedom, reducing oneself to a mere object.`,q:`What does Sartre mean by "bad faith"?`,a:`Denying inherent freedom and responsibility to avoid anguish.`,w:[`Believing in a higher power that dictates destiny.`,`Acting immorally against norms.`,`Rejecting that life has any inherent meaning.`],d:8},
    {t:`The anthropic principle in cosmology suggests that the universe's physical constants are fine-tuned to allow the emergence of life. The weak anthropic principle states that our observations are necessarily biased by the fact that we exist. The strong version proposes that the universe must have properties that allow life to develop, though this remains highly controversial.`,q:`What is the fundamental difference between the weak and strong anthropic principles?`,a:`The strong principle proposes the universe must allow life; the weak notes observational bias.`,w:[`They are completely identical in their claims.`,`The weak principle requires fine-tuning; the strong denies it.`,`Both deny the existence of fine-tuning.`],d:7},
    {t:`The concept of the "tragedy of the commons" describes a situation where individuals, acting independently and rationally according to their own self-interest, behave contrary to the best interests of the whole group by depleting some common resource. This concept was popularized by Garrett Hardin in 1968.`,q:`What causes the tragedy of the commons?`,a:`Individuals acting in rational self-interest deplete shared resources.`,w:[`Government overregulation of resources.`,`A lack of technology to manage resources.`,`Altruistic behavior by individuals.`],d:8},
    // 9-10
    {t:`The Sapir-Whorf hypothesis, also known as linguistic relativity, proposes that the structure of a language affects its speakers' worldview or cognition. The strong version asserts that language determines thought entirely, while the weak version suggests it merely influences thought. Modern cognitive science largely supports the weak version, acknowledging that language shapes our perception without fully determining it.`,q:`How does modern cognitive science view the Sapir-Whorf hypothesis?`,a:`It supports the weak version: language influences but does not fully determine thought.`,w:[`It fully supports the strong version: language determines thought.`,`It completely rejects any influence of language on thought.`,`It proves that all languages result in identical worldviews.`],d:9},
    {t:`In complex systems theory, the butterfly effect describes how small variations in the initial conditions of a dynamical system can produce large differences in the long-term outcome. This sensitivity means that long-term prediction is inherently impossible for systems like weather, even with perfect models, due to the impossibility of measuring initial conditions with infinite precision.`,q:`Why does the butterfly effect make long-term prediction impossible?`,a:`Because exact measurement of initial conditions is impossible, and small errors amplify.`,w:[`Because weather models are fundamentally flawed.`,`Because the system eventually stabilizes.`,`Because small changes always cancel each other out.`],d:10},
    {t:`The Dunning-Kruger effect is a cognitive bias in which people with low ability at a task overestimate their ability. It is related to the metacognitive inability of the unskilled to recognize their ineptitude. Conversely, highly skilled individuals may underestimate their relative competence, assuming that tasks which are easy for them are also easy for others.`,q:`What is the core mechanism of the Dunning-Kruger effect?`,a:`A metacognitive deficit where unskilled individuals fail to recognize their own incompetence.`,w:[`A complete lack of confidence in highly skilled individuals.`,`The tendency for experts to overestimate their abilities.`,`A universal cognitive bias affecting everyone equally.`],d:9},
    {t:`The theory of evolution by natural selection, proposed by Charles Darwin, postulates that species change over time through the differential survival and reproduction of individuals. This process is driven by heritable variations that confer advantages in specific environments. The elegant simplicity of the mechanism belies its profound implications for the diversity of life.`,q:`What is the fundamental driver of natural selection?`,a:`Differential survival and reproduction of individuals.`,w:[`The intentional adaptation of species to their environment.`,`The spontaneous generation of new traits.`,`The inheritance of acquired characteristics.`],d:10}
];

for(let d=1;d<=10;d++){for(let i=0;i<50;i++){
    let pool = readPassages.filter(x => Math.abs(x.d - d) <= 1);
    if(pool.length === 0) pool = readPassages;
    let p = pool[i % pool.length];
    
    let op=shuffleOpts(p.a,[...p.w]);
    b.Reading.push({
        subject:'Reading',
        question:`Passage:\n${p.t}\n\nQuestion: ${p.q}`,
        options:op.options,
        answerIndex:op.answerIndex,
        difficulty:d
    });
}}
b.Reading=shuffleArr(b.Reading);

// === 4. Science (500题) ===
const sciBase = [
    {q:`What do plants need to make food?`,a:`Sunlight, water, CO2`,w:[`Only sunlight`,`Only soil`,`Oxygen only`],d:1},
    {q:`Center of an atom called?`,a:`Nucleus`,w:[`Electron cloud`,`Proton`,`Neutron`],d:2},
    {q:`Which planet is closest to the Sun?`,a:`Mercury`,w:[`Venus`,`Earth`,`Mars`],d:1},
    {q:`What is water made of?`,a:`Hydrogen and Oxygen`,w:[`Carbon and Oxygen`,`Oxygen and Nitrogen`,`Hydrogen and Helium`],d:2},
    {q:`Primary function of mitochondria?`,a:`ATP production`,w:[`Protein synthesis`,`Lipid storage`,`DNA replication`],d:3},
    {q:`Newton's second law?`,a:`F=ma`,w:[`E=mc²`,`PV=nRT`,`v=d/t`],d:3},
    {q:`Process by which plants make food?`,a:`Photosynthesis`,w:[`Respiration`,`Transpiration`,`Digestion`],d:4},
    {q:`Most abundant gas in Earth's atmosphere?`,a:`Nitrogen`,w:[`Oxygen`,`Carbon dioxide`,`Argon`],d:4},
    {q:`First law of thermodynamics?`,a:`Energy is conserved`,w:[`Entropy increases`,`Force equals mass times acceleration`,`Action-reaction`],d:5},
    {q:`Role of enzymes in biological reactions?`,a:`Decrease activation energy`,w:[`Increase activation energy`,`Provide energy`,`Consume energy`],d:5},
    {q:`Difference between mitosis and meiosis?`,a:`Mitosis produces 2 identical cells, meiosis 4 different`,w:[`Mitosis produces 4 cells, meiosis 2`,`Both produce 2 cells`,`Mitosis is for sex cells`],d:6},
    {q:`Function of the ribosome?`,a:`Protein synthesis`,w:[`Lipid synthesis`,`Carbohydrate synthesis`,`DNA replication`],d:6},
    {q:`Heisenberg uncertainty principle?`,a:`Cannot know position and momentum exactly`,w:[`Can know both exactly`,`Energy is quantized`,`Light is a wave`],d:7},
    {q:`Ionic vs covalent bond?`,a:`Ionic transfers electrons, covalent shares`,w:[`Ionic shares electrons, covalent transfers`,`Both share electrons`,`Both transfer electrons`],d:7},
    {q:`Role of ATP synthase in cellular respiration?`,a:`Produce ATP`,w:[`Break down glucose`,`Store oxygen`,`Transport electrons`],d:8},
    {q:`Pauli exclusion principle?`,a:`No two electrons can have the same quantum numbers`,w:[`Electrons orbit the nucleus`,`Energy is quantized`,`Light is a particle`],d:8},
    {q:`Which statement describes the Pauli exclusion principle?`,a:`No two fermions can occupy the same quantum state simultaneously.`,w:[`Bosons cannot share a quantum state.`,`Electrons orbit in discrete shells.`,`Energy is always conserved in a closed system.`],d:9},
    {q:`Role of the Krebs cycle?`,a:`To generate electron carriers for the electron transport chain.`,w:[`To produce glucose from CO2.`,`To break down fatty acids directly.`,`To synthesize proteins.`],d:9},
    {q:`Which quantum number determines the shape of an atomic orbital?`,a:`Azimuthal quantum number (l)`,w:[`Principal quantum number (n)`,`Magnetic quantum number (m)`,`Spin quantum number (s)`],d:10},
    {q:`Effect of a catalyst on a chemical reaction?`,a:`It lowers activation energy without being consumed.`,w:[`It increases the activation energy.`,`It changes the equilibrium constant.`,`It is consumed during the reaction.`],d:10}
];

for(let d=1;d<=10;d++){for(let i=0;i<50;i++){
    let pool = sciBase.filter(x => x.d === d);
    let base = pool[i % pool.length];
    let contexts = [`[General Science] `, `[Advanced Physics] `, `[Molecular Biology] `, `[Chemistry] `, `[Ecology] `];
    let q = (i >= pool.length ? contexts[i % contexts.length] : '') + base.q;
    let op=shuffleOpts(base.a,[...base.w]);
    b.Science.push({subject:'Science',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});
}}
b.Science=shuffleArr(b.Science);

return b;
}
const questionBank=genBank();
// 游戏逻辑
let currentSubject='Math',currentQuestion=null,currentIndex=0,currentDifficulty=1,correctCount=0,usedQuestions=[];
const TOTAL=40;
const subjectView=document.getElementById('subjectView'),quizView=document.getElementById('quizView'),resultView=document.getElementById('resultView');
const subjectSelector=document.getElementById('subjectSelector'),subjectBadge=document.getElementById('subjectBadge');
const questionCounter=document.getElementById('questionCounter'),difficultyDisplay=document.getElementById('difficultyDisplay');
const questionText=document.getElementById('questionText'),optionsContainer=document.getElementById('optionsContainer');
const feedbackArea=document.getElementById('feedbackArea'),nextBtn=document.getElementById('nextBtn'),skipBtn=document.getElementById('skipBtn');
const progressFill=document.getElementById('progressFill'),finalScore=document.getElementById('finalScore'),finalDetail=document.getElementById('finalDetail');
const difficultyResult=document.getElementById('difficultyResult'),restartBtn=document.getElementById('restartBtn');
function initSubjectView(){subjectView.classList.remove('hidden');quizView.classList.add('hidden');resultView.classList.add('hidden');progressFill.style.width='0%';subjectSelector.innerHTML='';['Math','Language Usage','Reading','Science'].forEach(sub=>{const btn=document.createElement('button');btn.className='subject-btn';btn.textContent=sub;btn.onclick=()=>startQuiz(sub);subjectSelector.appendChild(btn);});}
function startQuiz(subject){currentSubject=subject;subjectView.classList.add('hidden');quizView.classList.remove('hidden');resultView.classList.add('hidden');currentIndex=0;currentDifficulty=1;correctCount=0;usedQuestions=[];loadNextQuestion();}
function pickQuestion(diff){const bank=questionBank[currentSubject];let candidates=bank.filter(q=>!usedQuestions.includes(q)&&q.difficulty===diff);if(candidates.length===0){let minDiff=100;bank.forEach(q=>{if(!usedQuestions.includes(q))minDiff=Math.min(minDiff,Math.abs(q.difficulty-diff));});candidates=bank.filter(q=>!usedQuestions.includes(q)&&Math.abs(q.difficulty-diff)===minDiff);}return candidates.length>0?candidates[Math.floor(Math.random()*candidates.length)]:null;}
function loadNextQuestion(){if(currentIndex>=TOTAL){showResult();return;}const q=pickQuestion(currentDifficulty);if(!q){showResult();return;}currentQuestion=q;usedQuestions.push(q);subjectBadge.textContent=currentSubject;questionCounter.textContent=`Question ${currentIndex+1} / ${TOTAL}`;difficultyDisplay.textContent=`难度 ${currentDifficulty}`;questionText.textContent=q.question;optionsContainer.innerHTML='';q.options.forEach((opt,idx)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerHTML=`<span class="option-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span>`;btn.onclick=()=>handleAnswer(idx);optionsContainer.appendChild(btn);});feedbackArea.textContent='选择一个答案';feedbackArea.className='feedback-area';nextBtn.disabled=true;skipBtn.disabled=false;nextBtn.textContent=currentIndex===TOTAL-1?'完成测试':'下一题';progressFill.style.width=`${(currentIndex/TOTAL)*100}%`;}
function handleAnswer(selectedIdx){if(!nextBtn.disabled)return;const isCorrect=selectedIdx===currentQuestion.answerIndex;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===selectedIdx)btn.classList.add(isCorrect?'correct':'wrong');if(idx===currentQuestion.answerIndex&&idx!==selectedIdx)btn.classList.add('correct');});if(isCorrect){feedbackArea.textContent='✅ 正确！';feedbackArea.className='feedback-area correct-feedback';correctCount++;currentDifficulty=Math.min(10,currentDifficulty+1);}else{feedbackArea.textContent=`❌ 错误。正确答案: ${['A','B','C','D'][currentQuestion.answerIndex]}. ${currentQuestion.options[currentQuestion.answerIndex]}`;feedbackArea.className='feedback-area wrong-feedback';currentDifficulty=Math.max(1,currentDifficulty-1);}difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;}
skipBtn.onclick=()=>{if(skipBtn.disabled)return;const q=currentQuestion;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===q.answerIndex)btn.classList.add('correct');});feedbackArea.textContent=`⏭️ 已跳过。正确答案: ${['A','B','C','D'][q.answerIndex]}. ${q.options[q.answerIndex]}`;feedbackArea.className='feedback-area';currentDifficulty=Math.max(1,currentDifficulty-1);difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;};
nextBtn.onclick=()=>{currentIndex++;loadNextQuestion();};
function showResult(){quizView.classList.add('hidden');resultView.classList.remove('hidden');progressFill.style.width='100%';const accuracy=correctCount/TOTAL;const difficultyScore=(currentDifficulty/10);let finalScoreVal=Math.round((accuracy*210)+(difficultyScore*140));finalScoreVal=Math.min(350,finalScoreVal);finalScore.textContent=finalScoreVal;finalDetail.textContent=`正确 ${correctCount} / ${TOTAL} 题 · 最终难度 ${currentDifficulty}/10`;difficultyResult.textContent=`得分配比：正确率得分 (${Math.round(accuracy*210)}) + 难度得分 (${Math.round(difficultyScore*140)})`;}
restartBtn.onclick=initSubjectView;initSubjectView();
</script>
