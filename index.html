<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 极限自适应测试 · 完美均衡版</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
body{background:linear-gradient(145deg,#1e2b3c,#0f1a26);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.map-container{max-width:1100px;width:100%;background:#fff;border-radius:36px;box-shadow:0 30px 50px rgba(0,0,0,.6);overflow:hidden}
.progress-bar{background:#d9e2ec;height:8px;width:100%}
.progress-fill{height:8px;width:0;background:#2c7be5;transition:width .3s}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;border-bottom:2px solid #eef2f7;flex-wrap:wrap;gap:10px}
.subject-badge{background:#1e2b3c;color:#fff;font-weight:600;padding:8px 20px;border-radius:40px}
.question-counter,.difficulty-indicator{color:#4a5a6e;font-weight:600;background:#f0f4fa;padding:8px 20px;border-radius:40px}

/* 默认全屏（适合短题） */
.question-panel{padding:32px 40px 24px}
.question-text{font-size:1.15rem;font-weight:500;color:#0b1a2b;line-height:1.7;margin-bottom:30px;white-space:pre-wrap;max-height:380px;overflow-y:auto;padding-right:10px}
.options-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}

/* 左右分栏（适合长阅读题） */
.question-panel.split-view {
    display: flex;
    gap: 20px;
    max-height: 600px;
}
.question-panel.split-view .question-text {
    flex: 1;
    font-size: 1rem;
    line-height: 1.6;
    max-height: 550px;
    padding-right: 15px;
    border-right: 2px solid #eef2f7;
    white-space: pre-wrap;
    overflow-y: auto;
    margin-bottom: 0;
}
.question-panel.split-view .options-grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    margin-bottom: 0;
    max-height: 550px;
    overflow-y: auto;
    padding-left: 5px;
}

.option-btn{background:#f9fcff;border:2px solid #d0ddea;border-radius:20px;padding:18px 28px;font-size:1rem;font-weight:500;color:#1a2c3f;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:18px}
.option-btn:hover:not(:disabled){background:#e7f0fd;border-color:#2c7be5;transform:translateY(-2px)}
.option-btn.correct{background:#d7f0e0;border-color:#1e8e5e;color:#0c4a2e}
.option-btn.wrong{background:#ffe5e5;border-color:#d43b3b;color:#7a1f1f}
.option-btn:disabled{cursor:default;opacity:.95}
.option-letter{font-weight:700;background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1e2b3c;flex-shrink:0}
.option-btn.correct .option-letter{background:#1e8e5e;color:#fff}
.option-btn.wrong .option-letter{background:#d43b3b;color:#fff}
.feedback-area{background:#f3f7fe;border-radius:18px;padding:18px 24px;margin:10px 0 20px;font-size:1.1rem;color:#0e2b4a;display:flex;border-left:6px solid #2c7be5;min-height:60px;font-weight:500}
.feedback-area.correct-feedback{background:#e6f7ef;border-left-color:#1e8e5e;color:#0b4b2e}
.feedback-area.wrong-feedback{background:#ffefef;border-left-color:#d43b3b;color:#7a1f1f}
.action-buttons{display:flex;gap:16px;justify-content:flex-end;padding:8px 40px 40px}
.btn{border:none;font-weight:600;font-size:1.2rem;padding:16px 34px;border-radius:40px;cursor:pointer;transition:.15s}
.btn-primary{background:#2c7be5;color:#fff;box-shadow:0 8px 18px rgba(44,123,229,.3)}
.btn-primary:disabled{background:#b6c9e0;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;border:2px solid #cbd8e9;color:#1e2b3c}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.result-screen{padding:48px 40px;text-align:center}
.score-big{font-size:4rem;font-weight:800;color:#2c7be5;margin:20px 0}
.score-detail{font-size:1.3rem;color:#3d5068;margin-bottom:20px;background:#f3f8ff;padding:20px 30px;border-radius:30px;display:inline-block}
.restart-btn{background:#1e2b3c;color:#fff;padding:16px 48px;font-size:1.2rem;border-radius:40px;font-weight:600;cursor:pointer;border:none;margin-top:20px}
.hidden{display:none!important}
.subject-selector{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.subject-btn{background:#f0f4fa;border:2px solid #cbd8e9;border-radius:30px;padding:12px 28px;font-weight:600;cursor:pointer;transition:.15s;font-size:1.1rem}
.subject-btn:hover{background:#e0ecff;border-color:#2c7be5}
</style>
</head>
<body>
<div class="map-container">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="subjectView">
    <div class="test-header"><span class="subject-badge">MAP 挑战</span><span class="question-counter">选择科目</span></div>
    <div class="question-panel" style="text-align:center">
        <div style="font-size:2rem;font-weight:600;margin:20px 0 10px;color:#0b1a2b">🔥 极限自适应题库</div>
        <div style="font-size:1rem;color:#3d5068;margin-bottom:20px">A/B/C/D 概率均等 · 长篇分栏 · 难度严格分级</div>
        <div class="subject-selector">
            <button class="subject-btn" onclick="startQuiz('Math')">Math</button>
            <button class="subject-btn" onclick="startQuiz('Language Usage')">Language Usage</button>
            <button class="subject-btn" onclick="startQuiz('Reading')">Reading</button>
            <button class="subject-btn" onclick="startQuiz('Science')">Science</button>
        </div>
    </div>
</div>

<div id="quizView" class="hidden">
<div class="test-header"><span class="subject-badge" id="subjectBadge">Math</span><span class="question-counter" id="questionCounter">Question 1 / 40</span><span class="difficulty-indicator" id="difficultyDisplay">难度 1</span></div>
<div class="question-panel" id="questionPanelContainer">
<div class="question-text" id="questionText"></div>
<div class="options-grid" id="optionsContainer"></div>
<div class="feedback-area" id="feedbackArea">选择一个答案</div>
</div>
<div class="action-buttons"><button class="btn btn-outline" id="skipBtn" onclick="skipQuestion()">跳过</button><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button></div>
</div>

<div id="resultView" class="hidden">
<div class="result-screen">
<h2>✅ 测试完成</h2>
<div class="score-big" id="finalScore">0</div>
<div class="score-detail" id="finalDetail">0 / 40 正确</div>
<div style="margin-bottom:30px;font-size:1.1rem;color:#1e2b3c" id="difficultyResult"></div>
<button class="restart-btn" onclick="restartQuiz()">返回科目选择</button>
</div>
</div>
</div>

<script>
var questionBank = {
    Math: [],
    'Language Usage': [],
    Reading: [],
    Science: []
};

// 核心洗牌算法
function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = a[i];
        a[i] = a[j];
        a[j] = temp;
    }
    return a;
}

// 生成选项并确保正确答案定位绝对准确
function createOptions(correctAns, baseWrongs, level) {
    var allOpts = [correctAns].concat(baseWrongs);
    
    // 迷惑项伪装（打乱长度规律）
    var finalOpts = allOpts.map(function(opt) {
        if (Math.random() > 0.5) {
            if (level > 6) return opt + " (theoretical implications)";
            return "The exact answer is: " + opt;
        }
        return opt;
    });

    // 洗牌
    var shuffledOpts = shuffleArray(finalOpts);
    
    // 严谨定位：遍历洗牌后的数组，找到与变换后的正确项完全匹配的字符串
    // 因为我们在上面可能给正确选项加上了前后缀，所以需要在洗牌后，通过字符串匹配找到它
    // 这里最安全的做法是：先在 finalOpts 里找到被修饰过的正确答案，再在 shuffledOpts 里找它的索引
    
    var modifiedCorrect = finalOpts[0]; // 因为 allOpts[0] 是 correctAns
    var actualIndex = -1;
    for (var i = 0; i < shuffledOpts.length; i++) {
        if (shuffledOpts[i] === modifiedCorrect) {
            actualIndex = i;
            break;
        }
    }

    return {
        options: shuffledOpts,
        answerIndex: actualIndex
    };
}

function addUniqueQuestions(subject, list) {
    var seen = new Set();
    list.forEach(function(t) {
        var key = t.q + "|" + t.a;
        if (!seen.has(key)) {
            seen.add(key);
            var op = createOptions(t.a, t.w, t.d);
            questionBank[subject].push({
                subject: subject,
                question: t.q,
                options: op.options,
                answerIndex: op.answerIndex,
                difficulty: t.d,
                isLongPassage: t.isLongPassage || false
            });
        }
    });
}

function buildBank() {
    // ================= Math =================
    var mathList = [];
    for (var d = 1; d <= 10; d++) {
        for (var i = 0; i < 50; i++) {
            var a = (d * 10 + i * 3 + 1), b = (d * 7 + i * 2 + 5);
            if (d <= 2) {
                mathList.push({ q: "Calculate: " + a + " + " + b + " = ?", a: "" + (a+b), w: [""+(a+b+1), ""+(a+b-1), ""+(a+b+2)], d: d });
                mathList.push({ q: "Calculate: " + (a*2) + " - " + b + " = ?", a: "" + (a*2-b), w: [""+(a*2-b+1), ""+(a*2-b-1), ""+(a*2-b+3)], d: d });
            } else if (d <= 4) {
                mathList.push({ q: "Solve for x: " + a + "x - " + b + " = " + (a*5 - b) + "", a: "5", w: ["4", "6", "3"], d: d });
                mathList.push({ q: "Area of rectangle width " + a + " length " + b + "?", a: "" + (a*b), w: [""+(a+b), ""+(2*(a+b)), ""+(a*b+3)], d: d });
            } else if (d <= 6) {
                mathList.push({ q: "Derivative of " + a + "x^2 + " + b + "x?", a: "" + (2*a) + "x + " + b, w: [""+a+"x + "+b, ""+2*a+"x", ""+a+"x^2 + "+b], d: d });
                mathList.push({ q: "Limit as x->0 of sin(" + a + "x)/(" + b + "x)?", a: "" + (a/b), w: [""+(b/a), "1", "0"], d: d });
            } else if (d <= 8) {
                mathList.push({ q: "Integral of " + a + "x dx?", a: "" + (a/2) + "x^2 + C", w: [""+a+"x^2 + C", ""+(a/2)+"x + C", ""+a+"x + C"], d: d });
                mathList.push({ q: "Determinant of [[" + a + ", " + b + "], [" + b + ", " + a + "]]?", a: "" + (a*a - b*b), w: [""+(a*a + b*b), ""+(a*b), "0"], d: d });
            } else if (d === 9) {
                mathList.push({ q: "General solution to PDE: ∂u/∂t = " + a + " * ∂²u/∂x²", a: "u(x,t) = f(x)e^(-" + a + "t)", w: ["u(x,t) = f(x+" + a + "t)", "u(x,t) = f(x)g(t)", "u(x,t) = sin(" + a + "x)cos(t)"], d: d });
                mathList.push({ q: "Integral from 0 to ∞ of e^(-" + a + "x) dx?", a: "1/" + a, w: ["" + a, "1/" + (a*a), "0"], d: d });
            } else {
                mathList.push({ q: "Euler characteristic of genus " + a + " surface?", a: "" + (2-2*a), w: [""+(2*a-2), ""+(2*a), ""+(-2*a)], d: d });
                mathList.push({ q: "Solve Dirac equation for free particle. Predicts?", a: "Antimatter", w: ["Dark matter", "Magnetic monopoles", "Quantum entanglement"], d: d });
            }
        }
    }
    addUniqueQuestions('Math', mathList);

    // ================= Language Usage =================
    var langList = [];
    var pronoun = ["He", "She", "They", "We", "I", "The boy", "The girls"];
    var verb = ["is", "are", "was", "were", "has", "have"];
    var noun = ["dog", "cat", "car", "tree", "book", "house", "pen"];
    var contexts = ["[Literature] ", "[Formal] ", "[Everyday] ", "[Academic] ", "[Business] ", "[Journalism] ", "[Legal] ", "[Scientific] ", "[Historical] ", "[Philosophical] "];
    for (var d = 1; d <= 10; d++) {
        for (var i = 0; i < 50; i++) {
            var p = pronoun[i % pronoun.length], v = verb[i % verb.length], n = noun[i % noun.length], ctx = contexts[i % contexts.length];
            if (d <= 2) {
                langList.push({ q: ctx + "Correct verb: " + p + " _______ playing with the " + n + ".", a: v, w: [v+"s", v+"ing", "be "+v], d: d });
                langList.push({ q: ctx + "What is the noun in: 'The " + n + " runs.'", a: n, w: ["The", "runs", "fast"], d: d });
            } else if (d <= 4) {
                langList.push({ q: ctx + "Find the error: 'Neither of the " + n + "s were ready.'", a: "were", w: ["Neither", "of", "ready"], d: d });
                langList.push({ q: ctx + "Which uses colon correctly?", a: "He had one goal: to win.", w: ["He had: one goal.", "He had one goal; to win.", "He had one goal, to: win."], d: d });
            } else if (d <= 6) {
                langList.push({ q: ctx + "Fix the dangling modifier: 'Walking down the street, the " + n + "s were beautiful.'", a: "Walking down the street, I saw beautiful " + n + "s.", w: ["The " + n + "s were beautiful walking.", "Walking, the " + n + "s were.", "The street had " + n + "s walking."], d: d });
                langList.push({ q: ctx + "Clause type: 'Whoever finishes first will win.'", a: "Noun clause", w: ["Adjective", "Adverb", "Independent"], d: d });
            } else if (d <= 8) {
                langList.push({ q: ctx + "Inversion type: 'Seldom have I seen such courage.'", a: "Negative inversion", w: ["Locative", "Conditional", "Comparative"], d: d });
                langList.push({ q: ctx + "Logical fallacy: 'Either you support this or you are unpatriotic.'", a: "False dilemma", w: ["Ad hominem", "Straw man", "Slippery slope"], d: d });
            } else if (d === 9) {
                langList.push({ q: ctx + "Rhetorical device: 'The White House issued a statement.'", a: "Metonymy", w: ["Simile", "Personification", "Hyperbole"], d: d });
                langList.push({ q: ctx + "Meaning of 'perspicacious'?", a: "Having a ready insight", w: ["Lacking clarity", "Easily angered", "Overly cautious"], d: d });
            } else {
                langList.push({ q: ctx + "Syntax type: 'Hardly had he arrived when the storm broke.'", a: "Negative inversion", w: ["Locative", "Conditional", "Subject-verb"], d: d });
                langList.push({ q: ctx + "Meaning of 'to gild the lily'?", a: "Unnecessarily embellish", w: ["To ruin a good thing", "To hide the truth", "To praise excessively"], d: d });
            }
        }
    }
    addUniqueQuestions('Language Usage', langList);

    // ================= Reading (长篇左右分栏) =================
    var readList = [
        { q: "Passage:\nTom has a dog named Max. Max is brown and loves to play fetch in the park.\nQuestion: What color is Max?", a: "Brown", w: ["Black", "White", "Gray"], d: 1, isLongPassage: false },
        { q: "Passage:\nLily gets up at 6 a.m. every day. She goes running in the park for an hour. Her favorite sport is running.\nQuestion: What is Lily's favorite sport?", a: "Running", w: ["Swimming", "Basketball", "Soccer"], d: 1, isLongPassage: false },
        { q: "Passage:\nThe sun rises in the east and sets in the west. This is a natural phenomenon caused by the rotation of the Earth.\nQuestion: From which direction does the sun rise?", a: "East", w: ["West", "South", "North"], d: 2, isLongPassage: false },
        { q: "Passage:\nWater is essential for all known forms of life. It covers about 71% of the Earth's surface. Most of the water on Earth is in the oceans.\nQuestion: Where is most of Earth's water located?", a: "Oceans", w: ["Rivers", "Lakes", "Glaciers"], d: 2, isLongPassage: false },
        { q: "Passage:\nPhotosynthesis is the process by which green plants use sunlight to synthesize foods from carbon dioxide and water. It generates oxygen as a byproduct.\nQuestion: What is the primary function of photosynthesis?", a: "To synthesize food using sunlight", w: ["To release carbon dioxide", "To consume oxygen", "To break down glucose"], d: 3, isLongPassage: false },
        { q: "Passage:\nThe concept of 'cognitive dissonance' refers to the mental discomfort experienced by a person who holds two contradictory beliefs. To reduce this discomfort, individuals often change one of their beliefs to align with the other.\nQuestion: What is the main consequence of cognitive dissonance?", a: "Altering a belief to reduce discomfort", w: ["Increasing contradictory beliefs", "Ignoring mental discomfort", "A type of learning"], d: 3, isLongPassage: false },
        { q: "Passage:\nIn a free market economy, prices are determined by the forces of supply and demand. When demand exceeds supply, prices tend to rise, which encourages producers to increase supply.\nQuestion: According to the passage, what happens when demand exceeds supply?", a: "Prices rise, encouraging more supply", w: ["Prices fall, reducing supply", "Prices remain constant", "Demand decreases automatically"], d: 4, isLongPassage: false },
        { q: "Passage:\nThe Great Barrier Reef is the world's largest coral reef system. It is composed of over 2,900 individual reefs and 900 islands. It is located in the Coral Sea, off the coast of Queensland, Australia.\nQuestion: Where is the Great Barrier Reef located?", a: "Off the coast of Australia", w: ["In the Caribbean", "In the Pacific Ocean near Hawaii", "Off the coast of Florida"], d: 4, isLongPassage: false },
        { q: "Passage:\nThe human brain is highly adaptable due to neuroplasticity, which allows it to reorganize itself by forming new neural connections throughout life. This is crucial for learning new skills and recovering from brain injuries.\nQuestion: Why is neuroplasticity important?", a: "It helps the brain adapt and recover", w: ["It prevents all brain injuries", "It stops brain growth", "It reduces brain function"], d: 5, isLongPassage: false },
        { q: "Passage:\nThe proliferation of digital echo chambers has fundamentally altered the epistemological landscape of modern democracies. Algorithmic curation creates insulated realities where confirmation bias is an engineered feature. The result is an epistemic crisis where objective truth is subordinated to tribal identity.\nQuestion: What is the ultimate consequence of algorithmic echo chambers on democracy?", a: "They destroy the shared factual basis required for deliberation.", w: ["They increase healthy competition among factions.", "They eliminate confirmation bias through exposure.", "They foster a vibrant marketplace of ideas."], d: 6, isLongPassage: false },
        { q: "Passage:\nThe EPR paradox argued that quantum mechanics was incomplete. Einstein derided entanglement as 'spooky action at a distance.' However, Bell's theorem later demonstrated that no local hidden-variable theory could reproduce the predictions of quantum mechanics, forcing physicists to abandon local realism.\nQuestion: What was the significance of Bell's theorem?", a: "It showed local hidden-variable theories are incompatible with quantum mechanics.", w: ["It proved special relativity was flawed.", "It confirmed faster-than-light communication.", "It validated the EPR paradox."], d: 6, isLongPassage: false },
        { q: "Passage:\nThe Industrial Revolution marked a major turning point in history. Almost every aspect of daily life was influenced. Average income and population began to exhibit unprecedented sustained growth.\nQuestion: What was a major effect of the Industrial Revolution?", a: "Unprecedented sustained growth in income and population", w: ["A decline in population", "The end of agriculture", "A decrease in average income"], d: 7, isLongPassage: false },
        { q: "Passage:\nThe economic history of the Industrial Revolution is often framed as a triumph of innovation, but this narrative obscures the profound social upheaval it entailed. The enclosure movement created a vast, exploitable labor force, entrenching systemic inequalities.\nQuestion: What is the author's main critique of the traditional narrative?", a: "It overlooks the severe social costs and systemic inequalities.", w: ["It overstates the role of technological innovation.", "It fails to acknowledge economic benefits.", "It exaggerates dehumanizing conditions."], d: 7, isLongPassage: false },
        { q: "Passage:\nThe existentialist notion that 'existence precedes essence' is a radical departure from classical philosophy. For Sartre, humanity is condemned to be free; we are thrust into a meaningless universe and must forge our own meaning through authentic choices. To escape this responsibility through 'bad faith' is to deny one's own freedom, reducing oneself to a mere object. This fundamental freedom is inescapable, as even the refusal to choose constitutes a choice. Therefore, authenticity requires acknowledging this absolute responsibility.\n\nQuestion: What does Sartre mean by 'bad faith'?", a: "Denying inherent freedom and responsibility to avoid anguish.", w: ["Believing in a higher power that dictates destiny.", "Acting immorally against established societal norms.", "Rejecting the idea that life has any inherent meaning."], d: 8, isLongPassage: true },
        { q: "Passage:\nThe anthropic principle in cosmology suggests that the universe's physical constants are fine-tuned to allow the emergence of life. The weak anthropic principle states that our observations are necessarily biased by our existence; we can only observe a universe capable of supporting observers. The strong version proposes that the universe must have properties that allow life to develop. However, critics argue that the strong version is teleological and unscientific, as it implies a purposeful design rather than random chance.\n\nQuestion: What is the fundamental difference between the weak and strong anthropic principles?", a: "The strong principle proposes the universe must allow life; the weak notes observational bias.", w: ["They are completely identical in their claims.", "The weak principle requires fine-tuning; the strong denies it.", "Both deny the existence of fine-tuning."], d: 8, isLongPassage: true },
        { q: "Passage:\nThe concept of the 'tragedy of the commons' describes a situation where individuals, acting independently and rationally according to their own self-interest, behave contrary to the best interests of the whole group by depleting some common resource. This occurs because the costs of overuse are distributed among all users, while the benefits are concentrated on the individual. Without regulation or privatization, rational actors will inevitably exhaust the shared resource, leading to collective ruin.\n\nQuestion: What causes the tragedy of the commons?", a: "Individuals acting in rational self-interest deplete shared resources.", w: ["Government overregulation of resources.", "A lack of technology to manage resources.", "Altruistic behavior by individuals."], d: 8, isLongPassage: true },
        { q: "Passage:\nThe Sapir-Whorf hypothesis proposes that the structure of a language affects its speakers' worldview or cognition. The strong version asserts that language determines thought entirely, creating inescapable cognitive boundaries. The weak version suggests it merely influences thought, shaping perception without fully constraining it. Modern cognitive science largely supports the weak version, acknowledging that linguistic categories can subtly guide attention and memory, but denying that they imprison the mind.\n\nQuestion: How does modern cognitive science view the Sapir-Whorf hypothesis?", a: "It supports the weak version: language influences but does not fully determine thought.", w: ["It fully supports the strong version: language determines thought.", "It completely rejects any influence of language on thought.", "It proves that all languages result in identical worldviews."], d: 9, isLongPassage: true },
        { q: "Passage:\nIn complex systems theory, the butterfly effect describes how small variations in the initial conditions of a dynamical system can produce large differences in the long-term outcome. This sensitivity means that long-term prediction is inherently impossible for chaotic systems like weather, even with perfect models, due to the impossibility of measuring initial conditions with infinite precision. Any minute error in measurement will amplify exponentially over time.\n\nQuestion: Why does the butterfly effect make long-term prediction impossible?", a: "Because exact measurement of initial conditions is impossible, and small errors amplify.", w: ["Because weather models are fundamentally flawed.", "Because the system eventually stabilizes.", "Because small changes always cancel each other out."], d: 9, isLongPassage: true },
        { q: "Passage:\nThe Dunning-Kruger effect is a cognitive bias in which people with low ability at a task overestimate their ability. It is related to the metacognitive inability of the unskilled to recognize their ineptitude. Conversely, highly skilled individuals may underestimate their relative competence, assuming that tasks which are easy for them are also easy for others. This dual burden of incompetence and unrecognized incompetence creates a profound distortion in self-assessment.\n\nQuestion: What is the core mechanism of the Dunning-Kruger effect?", a: "A metacognitive deficit where unskilled individuals fail to recognize their own incompetence.", w: ["A complete lack of confidence in highly skilled individuals.", "The tendency for experts to overestimate their abilities.", "A universal cognitive bias affecting everyone equally."], d: 10, isLongPassage: true },
        { q: "Passage:\nThe theory of evolution by natural selection postulates that species change over time through the differential survival and reproduction of individuals. This process is driven by heritable variations that confer advantages in specific environments. Over generations, these advantageous traits become more common, leading to adaptation. The elegant simplicity of the mechanism belies its profound implications for the diversity and complexity of life on Earth.\n\nQuestion: What is the fundamental driver of natural selection?", a: "Differential survival and reproduction of individuals.", w: ["The intentional adaptation of species to their environment.", "The spontaneous generation of new traits.", "The inheritance of acquired characteristics."], d: 10, isLongPassage: true }
    ];
    addUniqueQuestions('Reading', readList);

    // ================= Science =================
    var sciList = [];
    var sciContexts = ["[General] ", "[Physics] ", "[Biology] ", "[Chemistry] ", "[Ecology] ", "[Thermodynamics] ", "[Quantum] ", "[Genetics] ", "[Organic] ", "[Astrophysics] "];
    var sciTemplates = [
        { q: "Plants need to make food?", a: "Sunlight, water, CO2", w: ["Only sunlight", "Only soil", "Oxygen"], d: 1 },
        { q: "Center of atom?", a: "Nucleus", w: ["Electron", "Proton", "Neutron"], d: 1 },
        { q: "Closest planet to Sun?", a: "Mercury", w: ["Venus", "Earth", "Mars"], d: 2 },
        { q: "Water made of?", a: "H and O", w: ["C and O", "O and N", "H and He"], d: 2 },
        { q: "Mitochondria function?", a: "ATP production", w: ["Protein", "Lipid", "DNA"], d: 3 },
        { q: "Newton's second law?", a: "F=ma", w: ["E=mc²", "PV=nRT", "v=d/t"], d: 3 },
        { q: "Process by which plants make food?", a: "Photosynthesis", w: ["Respiration", "Transpiration", "Digestion"], d: 4 },
        { q: "Most abundant gas?", a: "Nitrogen", w: ["Oxygen", "CO2", "Argon"], d: 4 },
        { q: "First law of thermodynamics?", a: "Energy conserved", w: ["Entropy increases", "F=ma", "Action-reaction"], d: 5 },
        { q: "Role of enzymes?", a: "Decrease activation energy", w: ["Increase", "Provide energy", "Consume"], d: 5 },
        { q: "Mitosis vs meiosis?", a: "Mitosis 2, meiosis 4", w: ["Mitosis 4, meiosis 2", "Both 2", "Mitosis sex cells"], d: 6 },
        { q: "Ribosome function?", a: "Protein synthesis", w: ["Lipid", "Carbohydrate", "DNA replication"], d: 6 },
        { q: "Heisenberg uncertainty?", a: "Cannot know both exactly", w: ["Can know both", "Energy quantized", "Light wave"], d: 7 },
        { q: "Ionic vs covalent?", a: "Ionic transfers, covalent shares", w: ["Ionic shares, covalent transfers", "Both share", "Both transfer"], d: 7 },
        { q: "ATP synthase role?", a: "Produce ATP", w: ["Break down glucose", "Store oxygen", "Transport electrons"], d: 8 },
        { q: "Pauli exclusion?", a: "No two electrons same quantum", w: ["Electrons orbit", "Energy quantized", "Light particle"], d: 8 },
        { q: "Pauli exclusion (fermions)?", a: "No two fermions same state", w: ["Bosons cannot share", "Electrons orbit", "Energy conserved"], d: 9 },
        { q: "Krebs cycle role?", a: "Generate electron carriers", w: ["Produce glucose", "Break down fatty acids", "Synthesize proteins"], d: 9 },
        { q: "Quantum number for shape?", a: "Azimuthal (l)", w: ["Principal (n)", "Magnetic (m)", "Spin (s)"], d: 10 },
        { q: "Catalyst effect?", a: "Lowers activation energy", w: ["Increases", "Changes equilibrium", "Consumed"], d: 10 }
    ];
    for (var d = 1; d <= 10; d++) {
        for (var i = 0; i < 50; i++) {
            var t = sciTemplates[i % sciTemplates.length];
            var ctx = sciContexts[i % sciContexts.length];
            sciList.push({ q: ctx + t.q, a: t.a, w: t.w, d: t.d });
        }
    }
    addUniqueQuestions('Science', sciList);
}

buildBank();

var currentSubject = 'Math';
var currentQuestion = null;
var currentIndex = 0;
var currentDifficulty = 1;
var correctCount = 0;
var usedQuestions = [];
var TOTAL = 40;

function startQuiz(subject) {
    currentSubject = subject;
    document.getElementById('subjectView').classList.add('hidden');
    document.getElementById('quizView').classList.remove('hidden');
    document.getElementById('resultView').classList.add('hidden');
    currentIndex = 0;
    currentDifficulty = 1;
    correctCount = 0;
    usedQuestions = [];
    loadNextQuestion();
}

function loadNextQuestion() {
    if (currentIndex >= TOTAL) { showResult(); return; }
    var q = pickQuestion(currentDifficulty);
    if (!q) { showResult(); return; }
    currentQuestion = q;
    usedQuestions.push(q);
    
    document.getElementById('subjectBadge').textContent = currentSubject;
    document.getElementById('questionCounter').textContent = "Question " + (currentIndex + 1) + " / " + TOTAL;
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('questionText').textContent = q.question;
    
    var optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    q.options.forEach(function(opt, idx) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="option-letter">' + ['A','B','C','D'][idx] + '</span><span>' + opt + '</span>';
        btn.onclick = function() { handleAnswer(idx); };
        optionsContainer.appendChild(btn);
    });

    var panel = document.getElementById('questionPanelContainer');
    if (q.isLongPassage) {
        panel.classList.add('split-view');
    } else {
        panel.classList.remove('split-view');
    }

    document.getElementById('feedbackArea').textContent = '选择一个答案';
    document.getElementById('feedbackArea').className = 'feedback-area';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('skipBtn').disabled = false;
    document.getElementById('nextBtn').textContent = currentIndex === TOTAL - 1 ? '完成测试' : '下一题';
    document.getElementById('progressFill').style.width = ((currentIndex / TOTAL) * 100) + '%';
}

function pickQuestion(diff) {
    var bank = questionBank[currentSubject];
    var candidates = bank.filter(function(q) { return !usedQuestions.includes(q) && q.difficulty === diff; });
    if (candidates.length === 0) {
        var minDiff = 100;
        bank.forEach(function(q) { if (!usedQuestions.includes(q)) minDiff = Math.min(minDiff, Math.abs(q.difficulty - diff)); });
        candidates = bank.filter(function(q) { return !usedQuestions.includes(q) && Math.abs(q.difficulty - diff) === minDiff; });
    }
    return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : null;
}

function handleAnswer(selectedIdx) {
    if (!document.getElementById('nextBtn').disabled) return;
    var isCorrect = selectedIdx === currentQuestion.answerIndex;
    
    document.querySelectorAll('.option-btn').forEach(function(btn, idx) {
        btn.disabled = true;
        if (idx === selectedIdx) btn.classList.add(isCorrect ? 'correct' : 'wrong');
        if (idx === currentQuestion.answerIndex && idx !== selectedIdx) btn.classList.add('correct');
    });

    if (isCorrect) {
        document.getElementById('feedbackArea').textContent = '✅ 正确！';
        document.getElementById('feedbackArea').className = 'feedback-area correct-feedback';
        correctCount++;
        currentDifficulty = Math.min(10, currentDifficulty + 1);
    } else {
        document.getElementById('feedbackArea').textContent = "❌ 错误。正确答案: " + ['A','B','C','D'][currentQuestion.answerIndex] + ". " + currentQuestion.options[currentQuestion.answerIndex];
        document.getElementById('feedbackArea').className = 'feedback-area wrong-feedback';
        currentDifficulty = Math.max(1, currentDifficulty - 1);
    }
    
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('skipBtn').disabled = true;
}

function skipQuestion() {
    if (document.getElementById('skipBtn').disabled) return;
    var q = currentQuestion;
    document.querySelectorAll('.option-btn').forEach(function(btn, idx) {
        btn.disabled = true;
        if (idx === q.answerIndex) btn.classList.add('correct');
    });
    document.getElementById('feedbackArea').textContent = "⏭️ 已跳过。正确答案: " + ['A','B','C','D'][q.answerIndex] + ". " + q.options[q.answerIndex];
    document.getElementById('feedbackArea').className = 'feedback-area';
    currentDifficulty = Math.max(1, currentDifficulty - 1);
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('skipBtn').disabled = true;
}

function nextQuestion() {
    currentIndex++;
    loadNextQuestion();
}

function showResult() {
    document.getElementById('quizView').classList.add('hidden');
    document.getElementById('resultView').classList.remove('hidden');
    document.getElementById('progressFill').style.width = '100%';
    
    var accuracy = correctCount / TOTAL;
    var difficultyScore = (currentDifficulty / 10);
    var finalScoreVal = Math.round((accuracy * 210) + (difficultyScore * 140));
    finalScoreVal = Math.min(350, finalScoreVal);
    
    document.getElementById('finalScore').textContent = finalScoreVal;
    document.getElementById('finalDetail').textContent = "正确 " + correctCount + " / " + TOTAL + " 题 · 最终难度 " + currentDifficulty + "/10";
    document.getElementById('difficultyResult').textContent = "得分配比：正确率得分 (" + Math.round(accuracy * 210) + ") + 难度得分 (" + Math.round(difficultyScore * 140) + ")";
}

function restartQuiz() {
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('subjectView').classList.remove('hidden');
    document.getElementById('progressFill').style.width = '0%';
}
</script>
