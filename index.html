<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 极限自适应测试 · 长篇阅读</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
body{background:linear-gradient(145deg,#1e2b3c,#0f1a26);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.map-container{max-width:950px;width:100%;background:#fff;border-radius:36px;box-shadow:0 30px 50px rgba(0,0,0,.6);overflow:hidden}
.progress-bar{background:#d9e2ec;height:8px;width:100%}
.progress-fill{height:8px;width:0;background:#2c7be5;transition:width .3s}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;border-bottom:2px solid #eef2f7;flex-wrap:wrap;gap:10px}
.subject-badge{background:#1e2b3c;color:#fff;font-weight:600;padding:8px 20px;border-radius:40px}
.question-counter,.difficulty-indicator{color:#4a5a6e;font-weight:600;background:#f0f4fa;padding:8px 20px;border-radius:40px}
.question-panel{padding:32px 40px 24px}
.question-text{font-size:1.15rem;font-weight:500;color:#0b1a2b;line-height:1.7;margin-bottom:30px;white-space:pre-wrap;max-height:380px;overflow-y:auto;padding-right:10px}
.question-text::-webkit-scrollbar{width:6px}
.question-text::-webkit-scrollbar-thumb{background:#cbd8e9;border-radius:3px}
.options-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.option-btn{background:#f9fcff;border:2px solid #d0ddea;border-radius:20px;padding:18px 28px;font-size:1.1rem;font-weight:500;color:#1a2c3f;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:18px}
.option-btn:hover:not(:disabled){background:#e7f0fd;border-color:#2c7be5;transform:translateY(-2px)}
.option-btn.correct{background:#d7f0e0;border-color:#1e8e5e;color:#0c4a2e}
.option-btn.wrong{background:#ffe5e5;border-color:#d43b3b;color:#7a1f1f}
.option-btn:disabled{cursor:default;opacity:.95}
.option-letter{font-weight:700;background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1e2b3c;flex-shrink:0}
.option-btn.correct .option-letter{background:#1e8e5e;color:#fff}
.option-btn.wrong .option-letter{background:#d43b3b;color:#fff}
.feedback-area{background:#f3f7fe;border-radius:18px;padding:18px 24px;margin:10px 0 20px;font-size:1.1rem;color:#0e2b4a;display:flex;border-left:6px solid #2c7be5;min-height:60px;font-weight:500}
.feedback-area.correct-feedback{background:#e6f7ef;border-left-color:#1e8e5e;color:#0b4b2e}
.feedback-area.wrong-feedback{background:#ffefef;border-left-color:#d43b3b;color:#7a1f1f}
.action-buttons{display:flex;gap:16px;justify-content:flex-end;padding:8px 40px 40px}
.btn{border:none;font-weight:600;font-size:1.2rem;padding:16px 34px;border-radius:40px;cursor:pointer;transition:.15s}
.btn-primary{background:#2c7be5;color:#fff;box-shadow:0 8px 18px rgba(44,123,229,.3)}
.btn-primary:disabled{background:#b6c9e0;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;border:2px solid #cbd8e9;color:#1e2b3c}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.result-screen{padding:48px 40px;text-align:center}
.score-big{font-size:4rem;font-weight:800;color:#2c7be5;margin:20px 0}
.score-detail{font-size:1.3rem;color:#3d5068;margin-bottom:20px;background:#f3f8ff;padding:20px 30px;border-radius:30px;display:inline-block}
.restart-btn{background:#1e2b3c;color:#fff;padding:16px 48px;font-size:1.2rem;border-radius:40px;font-weight:600;cursor:pointer;border:none;margin-top:20px}
.hidden{display:none!important}
.subject-selector{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.subject-btn{background:#f0f4fa;border:2px solid #cbd8e9;border-radius:30px;padding:12px 28px;font-weight:600;cursor:pointer;transition:.15s}
.subject-btn:hover{background:#e0ecff;border-color:#2c7be5}
</style>
</head>
<body>
<div class="map-container">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="subjectView">
<div class="test-header"><span class="subject-badge">MAP 挑战</span><span class="question-counter">选择科目</span></div>
<div class="question-panel" style="text-align:center">
<div style="font-size:2rem;font-weight:600;margin:20px 0 10px;color:#0b1a2b">🔥 阶梯式自适应挑战</div>
<div style="font-size:1rem;color:#3d5068;margin-bottom:20px">长篇学术阅读 · 极致逻辑校验</div>
<div class="subject-selector" id="subjectSelector"></div>
</div>
</div>
<div id="quizView" class="hidden">
<div class="test-header"><span class="subject-badge" id="subjectBadge">Math</span><span class="question-counter" id="questionCounter">Question 1 / 40</span><span class="difficulty-indicator" id="difficultyDisplay">难度 1</span></div>
<div class="question-panel">
<div class="question-text" id="questionText"></div>
<div class="options-grid" id="optionsContainer"></div>
<div class="feedback-area" id="feedbackArea">选择一个答案</div>
</div>
<div class="action-buttons"><button class="btn btn-outline" id="skipBtn">跳过</button><button class="btn btn-primary" id="nextBtn" disabled>下一题</button></div>
</div>
<div id="resultView" class="hidden">
<div class="result-screen">
<h2>✅ 测试完成</h2>
<div class="score-big" id="finalScore">0</div>
<div class="score-detail" id="finalDetail">0 / 40 正确</div>
<div style="margin-bottom:30px;font-size:1.1rem;color:#1e2b3c" id="difficultyResult"></div>
<button class="restart-btn" id="restartBtn">返回科目选择</button>
</div>
</div>
</div>
<script>
function shuffleOpts(ans,wrongs){let o=[ans,...wrongs];for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return{options:o,answerIndex:o.indexOf(ans)};}
function genBank(){
const b={Math:[],'Language Usage':[],Reading:[],Science:[]};
const shuffleArr=a=>a.sort(()=>Math.random()-.5);

// Math (难度已整体再次提升)
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=2){ // 小学（复杂混合运算）
if(v===0){q=`${d*3+i*2} + ${d*5+i*4} = ?`;ans=`${d*3+i*2+d*5+i*4}`;wrongs=[`${d*3+i*2+d*5+i*4+3}`,`${d*3+i*2+d*5+i*4-3}`,`${d*3+i*2+d*5+i*4+7}`]}
else if(v===1){q=`${d*18} - ${i*3+5} = ?`;ans=`${d*18-i*3-5}`;wrongs=[`${d*18-i*3}`,`${d*18-i*3-8}`,`${d*18-i*3+2}`]}
else if(v===2){q=`${d*5+i} × ${d*3+2} = ?`;ans=`${(d*5+i)*(d*3+2)}`;wrongs=[`${(d*5+i)*(d*3+2)+4}`,`${(d*5+i)*(d*3+2)-4}`,`${(d*5+i)*(d*3+2)+9}`]}
else{q=`${d*24} ÷ ${d+3} = ? (Assume exact)`;ans=`${(d*24)/(d+3)}`;wrongs=[`${(d*24)/(d+3)+2}`,`${(d*24)/(d+3)-2}`,`${(d*24)/(d+3)+3}`]}
}
else if(d<=4){ // 初中（含参一元二次，几何进阶）
if(v===0){q=`If ${d}x + ${i*3+7} = ${d*5+i*3+7}, what is x?`;ans=`5`;wrongs=[`${d}`,`${i+2}`,`${d*2}`]}
else if(v===1){q=`What is the slope of the line perpendicular to y = ${d+1}x - ${i}?`;ans=`-1/${d+1}`;wrongs=[`${d+1}`,`-${d+1}`,`1/${d+1}`]}
else if(v===2){q=`Factor: x² - ${d+i+3}x + ${(d+3)*(i+1)}`;ans=`(x-${d+3})(x-${i+1})`;wrongs=[`(x+${d+3})(x+${i+1})`,`(x-${d+3})(x+${i+1})`,`(x+${d+3})(x-${i+1})`]}
else{q=`Area of a circle with radius ${d+i+2}? (in terms of π)`;ans=`${(d+i+2)*(d+i+2)}π`;wrongs=[`${2*(d+i+2)}π`,`${(d+i+2)*(d+i+2)/2}π`,`${(d+i+2)}π`]}
}
else if(d<=6){ // 高中（指数方程，函数变换，向量，组合数学）
if(v===0){q=`Value of log₂(${Math.pow(2,d+2)}) + log₂(${Math.pow(2,i+2)})?`;ans=`${d+i+4}`;wrongs=[`${d+i+3}`,`${d+i+5}`,`${d*i}`]}
else if(v===1){q=`Vertex of y = ${d+2}(x-${i+3})² - ${d*4}?`;ans=`(${i+3}, -${d*4})`;wrongs=[`(-${i+3}, -${d*4})`,`(${i+3}, ${d*4})`,`(-${i+3}, ${d*4})`]}
else if(v===2){q=`Solve: |${d+2}x - ${d*4}| = ${d*5}`;ans=`${d*9/(d+2)} or -${d/(d+2)}`;wrongs=[`${d*9/(d+2)} or ${d/(d+2)}`,`${d*9/(d+2)} only`,`-${d/(d+2)} only`]}
else{q=`lim(x→0) (sin(${d+2}x) / ${i+2}x)`;ans=`${(d+2)/(i+2)}`;wrongs=[`${(i+2)/(d+2)}`,`1`,`0`]}
}
else if(d<=8){ // 大学（多变量微积分，线性代数，级数）
if(v===0){q=`Partial derivative of f(x,y) = x^${d+1}y + e^(x+y) w.r.t x?`;ans=`${d+1}x^{${d}}y + e^(x+y)`;wrongs=[`${d+1}x^{${d}}y + xe^(x+y)`,`x^{${d+1}} + e^(x+y)`,`${d+1}x^{${d}}y`]}
else if(v===1){q=`Integral: ∫₀¹ (${d+1}x² + ${i+2}x) dx`;ans=`${(d+1)/3 + (i+2)/2}`;wrongs=[`${(d+1)/2 + (i+2)/3}`,`${(d+1)/3 + (i+2)}`,`${d+1 + (i+2)/2}`]}
else if(v===2){q=`Determinant of [[${d+2}, ${i+3}], [${i+2}, ${d+3}]]?`;ans=`${(d+2)*(d+3)-(i+2)*(i+3)}`;wrongs=[`${(d+2)*(d+3)+(i+2)*(i+3)}`,`${d+i+5}`,`0`]}
else{q=`Sum of geometric series: Σ (1/${d+1})^n (n=0 to ∞)`;ans=`${(d+1)/d}`;wrongs=[`${(d+1)/(d+2)}`,`${1/d}`,`${d+1}`]}
}
else if(d===9){ // 研究生（泰勒展开，复变函数，傅里叶）
if(v===0){q=`Evaluate: lim(x→0) (e^x - 1 - x - x²/2 - x³/6) / x⁴`;ans=`1/24`;wrongs=[`1/6`,`1/12`,`0`]}
else if(v===1){q=`If z = e^(iπ/4), what is z⁴?`;ans=`-1`;wrongs=[`1`,`i`,`-i`]}
else if(v===2){q=`Fourier transform of e^(-t²/2) results in?`;ans=`Gaussian`;wrongs=[`Sine`,`Cosine`,`Exponential`]}
else{q=`Laplace transform of t³?`;ans=`6/s⁴`;wrongs=[`3/s²`,`6/s³`,`1/s⁴`]}
}
else{ // 博士（拓扑，泛函，偏微分）
if(v===0){q=`Euler characteristic of a genus-3 surface?`;ans=`-4`;wrongs=[`0`,`-2`,`2`]}
else if(v===1){q=`Which space is compact but not Hausdorff?`;ans=`Sierpiński space`;wrongs=[`Real line`,`Closed interval`,`Unit sphere`]}
else if(v===2){q=`Solve the 1D wave equation: ∂²u/∂t² = c²∂²u/∂x². General solution?`;ans=`f(x-ct) + g(x+ct)`;wrongs=[`f(x) + g(t)`,`e^(x+ct)`,`sin(x)cos(ct)`]}
else{q=`Evaluate ∫(from -∞ to ∞) e^(-x²/4) dx?`;ans=`2√π`;wrongs=[`√π`,`√(2π)`,`4π`]}
}
let op=shuffleOpts(ans,wrongs);b.Math.push({subject:'Math',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Math=shuffleArr(b.Math);

// Language Usage (难度整体再次提升)
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=2){ // 小学（时态，复杂词性）
if(v===0){q=`Choose the correct pronoun: _______ are going to the store.`;ans=`They`;wrongs=[`Them`,`Their`,`There`]}
else if(v===1){q=`Past tense of "swim"?`;ans=`Swam`;wrongs=[`Swimmed`,`Swimming`,`Swims`]}
else if(v===2){q=`Which word is an adverb?`;ans=`Quickly`;wrongs=[`Quick`,`Run`,`Cat`]}
else{q=`Identify the noun: The dog runs quickly.`;ans=`Dog`;wrongs=[`Runs`,`Quickly`,`The`]}
}
else if(d<=4){ // 初中（主语一致，高级词汇，标点符号）
if(v===0){q=`Identify the error: "Neither of the options were appealing."`;ans=`were`;wrongs=[`Neither`,`of`,`appealing`]}
else if(v===1){q=`Synonym for "lucid"?`;ans=`Clear`;wrongs=[`Confusing`,`Secretive`,`Complex`]}
else if(v===2){q=`Which sentence uses the dash correctly?`;ans=`He had one goal—to win.`;wrongs=[`He had - one goal to win.`,`He had one goal; to win.`,`He had one goal, to - win.`]}
else{q=`Literary device in "The sun is a golden coin."?`;ans=`Metaphor`;wrongs=[`Simile`,`Personification`,`Hyperbole`]}
}
else if(d<=6){ // 高中（非谓语，倒装，高级词汇）
if(v===0){q=`Word: The evidence was ______ and could not be ignored.`;ans=`compelling`;wrongs=[`compelled`,`compel`,`compels`]}
else if(v===1){q=`Clause type: "Whoever finishes first will win."`;ans=`Noun clause`;wrongs=[`Adjective clause`,`Adverb clause`,`Independent clause`]}
else if(v===2){q=`Correct pronoun: It was ______ who called you.`;ans=`she`;wrongs=[`her`,`hers`,`herself`]}
else{q=`Tone: "The policy was a masterclass in obfuscation."`;ans=`Critical`;wrongs=[`Admiring`,`Supportive`,`Neutral`]}
}
else if(d<=8){ // 大学（复杂虚拟，逻辑谬误，高级语法）
if(v===0){q=`Inversion: "Seldom have I seen such courage." What type?`;ans=`Negative inversion`;wrongs=[`Locative inversion`,`Conditional inversion`,`Comparative inversion`]}
else if(v===1){q=`Word: Her argument was so ______ that the audience was stunned.`;ans=`cogent`;wrongs=[`tenuous`,`belligerent`,`superficial`]}
else if(v===2){q=`Plural of "cactus"?`;ans=`cacti`;wrongs=[`cactuses`,`cactis`,`cactus`]}
else{q=`Logical fallacy: "Either you support this policy or you are unpatriotic."`;ans=`False dilemma`;wrongs=[`Ad hominem`,`Straw man`,`Slippery slope`]}
}
else if(d===9){ // 研究生
if(v===0){q=`Which sentence uses the subjunctive correctly in a past context?`;ans=`If he had been here, he would have agreed.`;wrongs=[`If he was here, he would agree.`,`If he is here, he would agree.`,`If he were here, he will agree.`]}
else if(v===1){q=`Identify the rhetorical device: "The White House issued a statement."`;ans=`Metonymy`;wrongs=[`Simile`,`Personification`,`Hyperbole`]}
else if(v===2){q=`Meaning of "perspicacious"?`;ans=`Having a ready insight into things`;wrongs=[`Lacking clarity`,`Easily angered`,`Overly cautious`]}
else{q=`Choose the correct word: The medicine had a profound ______ on the patient.`;ans=`effect`;wrongs=[`affect`,`effective`,`affective`]}
}
else{ // 博士
if(v===0){q=`Analyze the syntax: "Hardly had he arrived when the storm broke." Type?`;ans=`Negative inversion`;wrongs=[`Locative inversion`,`Conditional inversion`,`Subject-verb inversion`]}
else if(v===1){q=`Choose the best word: The professor's ______ critique demolished the thesis.`;ans=`incisive`;wrongs=[`superficial`,`ambiguous`,`tenuous`]}
else if(v===2){q=`Meaning of the idiom "to gild the lily"?`;ans=`To unnecessarily embellish something already beautiful`;wrongs=[`To ruin a good thing by adding too much`,`To hide the truth with lies`,`To praise someone excessively`]}
else{q=`Rhetorical device in "The wind whispered through the trees"?`;ans=`Personification`;wrongs=[`Simile`,`Metaphor`,`Hyperbole`]}
}
let op=shuffleOpts(ans,wrongs);b['Language Usage'].push({subject:'Language Usage',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b['Language Usage']=shuffleArr(b['Language Usage']);

// Reading (全新逻辑自洽引擎：每道题搭配专属文章与逻辑匹配的问题)
const readPassages = {
    easy: [
        { t: "Tom has a small dog. The dog is brown. Tom likes to play with the dog.", q: "What color is Tom's dog?", a: "Brown", w: ["Black", "White", "Gray"] },
        { t: "Lily gets up at 6 a.m. She goes running in the park every day. Her favorite sport is running.", q: "What sport does Lily like best?", a: "Running", w: ["Swimming", "Basketball", "Soccer"] },
        { t: "The sun is very bright. It gives us light and heat. Plants need sunlight to grow.", q: "What do plants need to grow?", a: "Sunlight", w: ["Darkness", "Moonlight", "Wind"] },
        { t: "Sam has three apples. He gives one to his sister. Now he has two apples.", q: "How many apples does Sam have now?", a: "Two", w: ["One", "Three", "Four"] }
    ],
    mid: [
        { t: "The concept of 'cognitive dissonance' refers to the mental discomfort experienced by a person who holds two or more contradictory beliefs. This discomfort often leads to an alteration in one of the beliefs to reduce the dissonance.", q: "What is the main consequence of cognitive dissonance?", a: "Altering a belief to reduce discomfort", w: ["Increasing contradictory beliefs", "Ignoring mental discomfort", "A type of learning"] },
        { t: "Photosynthesis is the process by which green plants use sunlight to synthesize foods from carbon dioxide and water. It generates oxygen as a byproduct.", q: "What is the primary function of photosynthesis?", a: "To synthesize food using sunlight", w: ["To release carbon dioxide", "To consume oxygen", "To break down glucose"] },
        { t: "In a free market economy, prices are determined by the forces of supply and demand. When demand exceeds supply, prices tend to rise, which in turn encourages producers to increase supply.", q: "According to the passage, what happens when demand exceeds supply?", a: "Prices rise, encouraging more supply", w: ["Prices fall, reducing supply", "Prices remain constant", "Demand decreases automatically"] },
        { t: "The human brain is highly adaptable. Neuroplasticity allows it to reorganize itself by forming new neural connections throughout life. This is crucial for learning and recovering from injury.", q: "Why is neuroplasticity important?", a: "It helps the brain adapt and recover", w: ["It prevents all brain injuries", "It stops brain growth", "It reduces brain function"] }
    ],
    hard: [
        { t: "The proliferation of digital echo chambers has fundamentally altered the epistemological landscape of modern democracies. Rather than fostering a vibrant marketplace of ideas, algorithmic curation creates insulated realities where confirmation bias is not merely a psychological tendency but an engineered feature. The result is an epistemic crisis where objective truth is subordinated to tribal identity.", q: "What is the ultimate consequence of algorithmic echo chambers on democracy?", a: "They destroy the shared factual basis required for deliberation.", w: ["They increase healthy competition among factions.", "They eliminate confirmation bias through exposure.", "They foster a vibrant marketplace of ideas."] },
        { t: "The EPR paradox argued that quantum mechanics was incomplete. Einstein derided entanglement as 'spooky action at a distance.' However, Bell's theorem later demonstrated that no local hidden-variable theory could reproduce the predictions of quantum mechanics, forcing physicists to abandon local realism.", q: "What was the significance of Bell's theorem?", a: "It showed local hidden-variable theories are incompatible with quantum mechanics.", w: ["It proved special relativity was flawed.", "It confirmed faster-than-light communication.", "It validated the EPR paradox."] },
        { t: "The economic history of the Industrial Revolution is often framed as a triumph of innovation, but this narrative obscures the profound social upheaval it entailed. The enclosure movement and rural-to-urban migration created a vast, exploitable labor force. While the factory system generated unprecedented wealth, it entrenched systemic inequalities.", q: "What is the author's main critique of the traditional narrative?", a: "It overlooks the severe social costs and systemic inequalities.", w: ["It overstates the role of technological innovation.", "It fails to acknowledge economic benefits.", "It exaggerates dehumanizing conditions."] },
        { t: "In cognitive psychology, the 'availability heuristic' is a mental shortcut that relies on immediate examples that come to mind. When evaluating a specific topic or decision, a person using this heuristic may judge the frequency or likelihood of an event by the ease with which instances come to mind, leading to systematic biases.", q: "What does the availability heuristic lead to?", a: "Systematic biases based on ease of recall", w: ["Accurate probability judgments", "Logical decision-making", "Complete elimination of biases"] }
    ],
    extreme: [
        { t: "The existentialist notion that 'existence precedes essence' is a radical departure from classical philosophical traditions. For Sartre, this means humanity is condemned to be free; we are thrust into a meaningless universe and must forge our own meaning through authentic choices. To escape this responsibility through 'bad faith' is to deny one's own freedom, reducing oneself to a mere object.", q: "What does Sartre mean by 'bad faith'?", a: "Denying inherent freedom and responsibility to avoid anguish.", w: ["Believing in a higher power that dictates destiny.", "Acting immorally against norms.", "Rejecting that life has any inherent meaning."] },
        { t: "The anthropic principle in cosmology suggests that the universe's physical constants are fine-tuned to allow the emergence of life. The weak anthropic principle states that our observations are necessarily biased by the fact that we exist. The strong version proposes that the universe must have properties that allow life to develop, though this remains highly controversial.", q: "What is the fundamental difference between the weak and strong anthropic principles?", a: "The strong principle proposes the universe must allow life; the weak notes observational bias.", w: ["They are completely identical in their claims.", "The weak principle requires fine-tuning; the strong denies it.", "Both deny the existence of fine-tuning."] },
        { t: "The Sapir-Whorf hypothesis, also known as linguistic relativity, proposes that the structure of a language affects its speakers' worldview or cognition. The strong version asserts that language determines thought entirely, while the weak version suggests it merely influences thought. Modern cognitive science largely supports the weak version, acknowledging that language shapes our perception without fully determining it.", q: "How does modern cognitive science view the Sapir-Whorf hypothesis?", a: "It supports the weak version: language influences but does not fully determine thought.", w: ["It fully supports the strong version: language determines thought.", "It completely rejects any influence of language on thought.", "It proves that all languages result in identical worldviews."] },
        { t: "In complex systems theory, the butterfly effect describes how small variations in the initial conditions of a dynamical system can produce large differences in the long-term outcome. This sensitivity means that long-term prediction is inherently impossible for systems like weather, even with perfect models, due to the impossibility of measuring initial conditions with infinite precision.", q: "Why does the butterfly effect make long-term prediction impossible?", a: "Because exact measurement of initial conditions is impossible, and small errors amplify.", w: ["Because weather models are fundamentally flawed.", "Because the system eventually stabilizes.", "Because small changes always cancel each other out."] }
    ]
};

for(let d=1;d<=10;d++){
    for(let i=0;i<40;i++){
        let pool;
        if(d<=2) pool=readPassages.easy;
        else if(d<=4) pool=readPassages.mid;
        else if(d<=8) pool=readPassages.hard;
        else pool=readPassages.extreme;
        
        // 随机选一篇严密匹配的文章
        let p = pool[i % pool.length];
        let q = p.q;
        let ans = p.a;
        let wrongs = [...p.w];
        
        let op=shuffleOpts(ans,wrongs);
        b.Reading.push({
            subject:'Reading',
            question:`Passage:\n${p.t}\n\nQuestion: ${q}`,
            options:op.options,
            answerIndex:op.answerIndex,
            difficulty:d
        });
    }
}
b.Reading=shuffleArr(b.Reading);

// Science (难度整体再次提升)
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=2){ // 小学（基础事实变复杂）
if(v===0){q=`What do plants need to make food?`;ans=`Sunlight, water, and CO2`;wrongs=[`Only sunlight`,`Only soil`,`Oxygen only`]}
else if(v===1){q=`What is the center of an atom called?`;ans=`Nucleus`;wrongs=[`Electron cloud`,`Proton`,`Neutron`]}
else if(v===2){q=`Which planet is closest to the Sun?`;ans=`Mercury`;wrongs=[`Venus`,`Earth`,`Mars`]}
else{q=`What is water made of?`;ans=`Hydrogen and Oxygen`;wrongs=[`Carbon and Oxygen`,`Oxygen and Nitrogen`,`Hydrogen and Helium`]}
}
else if(d<=4){ // 初中（细胞功能，物理定律）
if(v===0){q=`Primary function of mitochondria?`;ans=`ATP production`;wrongs=[`Protein synthesis`,`Lipid storage`,`DNA replication`]}
else if(v===1){q=`Newton's second law?`;ans=`F=ma`;wrongs=[`E=mc²`,`PV=nRT`,`v=d/t`]}
else if(v===2){q=`Process by which plants make food?`;ans=`Photosynthesis`;wrongs=[`Respiration`,`Transpiration`,`Digestion`]}
else{q=`Most abundant gas in Earth's atmosphere?`;ans=`Nitrogen`;wrongs=[`Oxygen`,`Carbon dioxide`,`Argon`]}
}
else if(d<=6){ // 高中（热力学，酶，细胞分裂）
if(v===0){q=`What is the first law of thermodynamics?`;ans=`Energy is conserved`;wrongs=[`Entropy increases`,`Force equals mass times acceleration`,`Action-reaction`]}
else if(v===1){q=`What is the role of enzymes?`;ans=`Decrease activation energy`;wrongs=[`Increase activation energy`,`Provide energy`,`Consume energy`]}
else if(v===2){q=`Difference between mitosis and meiosis?`;ans=`Mitosis produces 2 identical cells, meiosis 4 different`;wrongs=[`Mitosis produces 4 cells, meiosis 2`,`Both produce 2 cells`,`Mitosis is for sex cells`]}
else{q=`What is the function of the ribosome?`;ans=`Protein synthesis`;wrongs=[`Lipid synthesis`,`Carbohydrate synthesis`,`DNA replication`]}
}
else if(d<=8){ // 大学（量子力学，化学键，热力学第二定律）
if(v===0){q=`What is the Heisenberg uncertainty principle?`;ans=`You cannot know both position and momentum exactly`;wrongs=[`You can know both exactly`,`Energy is quantized`,`Light is a wave`]}
else if(v===1){q=`Ionic vs covalent bond?`;ans=`Ionic transfers electrons, covalent shares`;wrongs=[`Ionic shares electrons, covalent transfers`,`Both share electrons`,`Both transfer electrons`]}
else if(v===2){q=`Role of ATP synthase in cellular respiration?`;ans=`Produce ATP`;wrongs=[`Break down glucose`,`Store oxygen`,`Transport electrons`]}
else{q=`Pauli exclusion principle?`;ans=`No two electrons can have the same quantum numbers`;wrongs=[`Electrons orbit the nucleus`,`Energy is quantized`,`Light is a particle`]}
}
else if(d===9){ // 研究生（泡利，Krebs，温室效应）
if(v===0){q=`Which statement describes the Pauli exclusion principle?`;ans=`No two fermions can occupy the same quantum state simultaneously.`;wrongs=[`Bosons cannot share a quantum state.`,`Electrons orbit in discrete shells.`,`Energy is always conserved in a closed system.`]}
else if(v===1){q=`What is the role of the Krebs cycle?`;ans=`To generate electron carriers for the electron transport chain.`;wrongs=[`To produce glucose from CO2.`,`To break down fatty acids directly.`,`To synthesize proteins.`]}
else if(v===2){q=`What is the greenhouse effect?`;ans=`Trapping of heat by atmospheric gases`;wrongs=[`Cooling of Earth by ozone`,`Ozone depletion by CFCs`,`Acid rain from sulfur dioxide`]}
else{q=`Which law states that entropy always increases?`;ans=`Second law of thermodynamics`;wrongs=[`First law of thermodynamics`,`Newton's law of cooling`,`Boyle's law`]}
}
else{ // 博士（量子数，催化剂，薛定谔，配分函数）
if(v===0){q=`Which quantum number determines the shape of an atomic orbital?`;ans=`Azimuthal quantum number (l)`;wrongs=[`Principal quantum number (n)`,`Magnetic quantum number (m)`,`Spin quantum number (s)`]}
else if(v===1){q=`What is the effect of a catalyst on a chemical reaction?`;ans=`It lowers the activation energy without being consumed.`;wrongs=[`It increases the activation energy.`,`It changes the equilibrium constant.`,`It is consumed during the reaction.`]}
else if(v===2){q=`What is the significance of the Schrödinger equation?`;ans=`It describes how the quantum state of a physical system changes over time.`;wrongs=[`It calculates the exact position of an electron.`,`It defines the speed of light in a vacuum.`,`It explains the emission spectrum of hydrogen only.`]}
else{q=`In statistical mechanics, what does the partition function describe?`;ans=`The statistical properties of a system in thermodynamic equilibrium.`;wrongs=[`The exact trajectories of particles.`,`The rate of a chemical reaction.`,`The interaction between quarks.`]}
}
let op=shuffleOpts(ans,wrongs);b.Science.push({subject:'Science',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Science=shuffleArr(b.Science);
return b;
}
const questionBank=genBank();
// 游戏逻辑
let currentSubject='Math',currentQuestion=null,currentIndex=0,currentDifficulty=1,correctCount=0,usedQuestions=[];
const TOTAL=40;
const subjectView=document.getElementById('subjectView'),quizView=document.getElementById('quizView'),resultView=document.getElementById('resultView');
const subjectSelector=document.getElementById('subjectSelector'),subjectBadge=document.getElementById('subjectBadge');
const questionCounter=document.getElementById('questionCounter'),difficultyDisplay=document.getElementById('difficultyDisplay');
const questionText=document.getElementById('questionText'),optionsContainer=document.getElementById('optionsContainer');
const feedbackArea=document.getElementById('feedbackArea'),nextBtn=document.getElementById('nextBtn'),skipBtn=document.getElementById('skipBtn');
const progressFill=document.getElementById('progressFill'),finalScore=document.getElementById('finalScore'),finalDetail=document.getElementById('finalDetail');
const difficultyResult=document.getElementById('difficultyResult'),restartBtn=document.getElementById('restartBtn');
function initSubjectView(){subjectView.classList.remove('hidden');quizView.classList.add('hidden');resultView.classList.add('hidden');progressFill.style.width='0%';subjectSelector.innerHTML='';['Math','Language Usage','Reading','Science'].forEach(sub=>{const btn=document.createElement('button');btn.className='subject-btn';btn.textContent=sub;btn.onclick=()=>startQuiz(sub);subjectSelector.appendChild(btn);});}
function startQuiz(subject){currentSubject=subject;subjectView.classList.add('hidden');quizView.classList.remove('hidden');resultView.classList.add('hidden');currentIndex=0;currentDifficulty=1;correctCount=0;usedQuestions=[];loadNextQuestion();}
function pickQuestion(diff){const bank=questionBank[currentSubject];let candidates=bank.filter(q=>!usedQuestions.includes(q)&&q.difficulty===diff);if(candidates.length===0){let minDiff=100;bank.forEach(q=>{if(!usedQuestions.includes(q))minDiff=Math.min(minDiff,Math.abs(q.difficulty-diff));});candidates=bank.filter(q=>!usedQuestions.includes(q)&&Math.abs(q.difficulty-diff)===minDiff);}return candidates.length>0?candidates[Math.floor(Math.random()*candidates.length)]:null;}
function loadNextQuestion(){if(currentIndex>=TOTAL){showResult();return;}const q=pickQuestion(currentDifficulty);if(!q){showResult();return;}currentQuestion=q;usedQuestions.push(q);subjectBadge.textContent=currentSubject;questionCounter.textContent=`Question ${currentIndex+1} / ${TOTAL}`;difficultyDisplay.textContent=`难度 ${currentDifficulty}`;questionText.textContent=q.question;optionsContainer.innerHTML='';q.options.forEach((opt,idx)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerHTML=`<span class="option-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span>`;btn.onclick=()=>handleAnswer(idx);optionsContainer.appendChild(btn);});feedbackArea.textContent='选择一个答案';feedbackArea.className='feedback-area';nextBtn.disabled=true;skipBtn.disabled=false;nextBtn.textContent=currentIndex===TOTAL-1?'完成测试':'下一题';progressFill.style.width=`${(currentIndex/TOTAL)*100}%`;}
function handleAnswer(selectedIdx){if(!nextBtn.disabled)return;const isCorrect=selectedIdx===currentQuestion.answerIndex;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===selectedIdx)btn.classList.add(isCorrect?'correct':'wrong');if(idx===currentQuestion.answerIndex&&idx!==selectedIdx)btn.classList.add('correct');});if(isCorrect){feedbackArea.textContent='✅ 正确！';feedbackArea.className='feedback-area correct-feedback';correctCount++;currentDifficulty=Math.min(10,currentDifficulty+1);}else{feedbackArea.textContent=`❌ 错误。正确答案: ${['A','B','C','D'][currentQuestion.answerIndex]}. ${currentQuestion.options[currentQuestion.answerIndex]}`;feedbackArea.className='feedback-area wrong-feedback';currentDifficulty=Math.max(1,currentDifficulty-1);}difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;}
skipBtn.onclick=()=>{if(skipBtn.disabled)return;const q=currentQuestion;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===q.answerIndex)btn.classList.add('correct');});feedbackArea.textContent=`⏭️ 已跳过。正确答案: ${['A','B','C','D'][q.answerIndex]}. ${q.options[q.answerIndex]}`;feedbackArea.className='feedback-area';currentDifficulty=Math.max(1,currentDifficulty-1);difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;};
nextBtn.onclick=()=>{currentIndex++;loadNextQuestion();};
function showResult(){quizView.classList.add('hidden');resultView.classList.remove('hidden');progressFill.style.width='100%';const accuracy=correctCount/TOTAL;const difficultyScore=(currentDifficulty/10);let finalScoreVal=Math.round((accuracy*210)+(difficultyScore*140));finalScoreVal=Math.min(350,finalScoreVal);finalScore.textContent=finalScoreVal;finalDetail.textContent=`正确 ${correctCount} / ${TOTAL} 题 · 最终难度 ${currentDifficulty}/10`;difficultyResult.textContent=`得分配比：正确率得分 (${Math.round(accuracy*210)}) + 难度得分 (${Math.round(difficultyScore*140)})`;}
restartBtn.onclick=initSubjectView;initSubjectView();
</script>
