<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 极限挑战</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
body{background:linear-gradient(145deg,#1e2b3c,#0f1a26);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.map-container{max-width:950px;width:100%;background:#fff;border-radius:36px;box-shadow:0 30px 50px rgba(0,0,0,.6);overflow:hidden}
.progress-bar{background:#d9e2ec;height:8px;width:100%}
.progress-fill{height:8px;width:0;background:#2c7be5;transition:width .3s}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;border-bottom:2px solid #eef2f7;flex-wrap:wrap;gap:10px}
.subject-badge{background:#1e2b3c;color:#fff;font-weight:600;padding:8px 20px;border-radius:40px}
.question-counter,.difficulty-indicator{color:#4a5a6e;font-weight:600;background:#f0f4fa;padding:8px 20px;border-radius:40px}
.question-panel{padding:32px 40px 24px}
.question-text{font-size:1.15rem;font-weight:500;color:#0b1a2b;line-height:1.7;margin-bottom:30px;white-space:pre-wrap;max-height:380px;overflow-y:auto;padding-right:10px}
.question-text::-webkit-scrollbar{width:6px}
.question-text::-webkit-scrollbar-thumb{background:#cbd8e9;border-radius:3px}
.options-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.option-btn{background:#f9fcff;border:2px solid #d0ddea;border-radius:20px;padding:18px 28px;font-size:1.1rem;font-weight:500;color:#1a2c3f;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:18px}
.option-btn:hover:not(:disabled){background:#e7f0fd;border-color:#2c7be5;transform:translateY(-2px)}
.option-btn.correct{background:#d7f0e0;border-color:#1e8e5e;color:#0c4a2e}
.option-btn.wrong{background:#ffe5e5;border-color:#d43b3b;color:#7a1f1f}
.option-btn:disabled{cursor:default;opacity:.95}
.option-letter{font-weight:700;background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1e2b3c;flex-shrink:0}
.option-btn.correct .option-letter{background:#1e8e5e;color:#fff}
.option-btn.wrong .option-letter{background:#d43b3b;color:#fff}
.feedback-area{background:#f3f7fe;border-radius:18px;padding:18px 24px;margin:10px 0 20px;font-size:1.1rem;color:#0e2b4a;display:flex;border-left:6px solid #2c7be5;min-height:60px;font-weight:500}
.feedback-area.correct-feedback{background:#e6f7ef;border-left-color:#1e8e5e;color:#0b4b2e}
.feedback-area.wrong-feedback{background:#ffefef;border-left-color:#d43b3b;color:#7a1f1f}
.action-buttons{display:flex;gap:16px;justify-content:flex-end;padding:8px 40px 40px}
.btn{border:none;font-weight:600;font-size:1.2rem;padding:16px 34px;border-radius:40px;cursor:pointer;transition:.15s}
.btn-primary{background:#2c7be5;color:#fff;box-shadow:0 8px 18px rgba(44,123,229,.3)}
.btn-primary:disabled{background:#b6c9e0;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;border:2px solid #cbd8e9;color:#1e2b3c}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.result-screen{padding:48px 40px;text-align:center}
.score-big{font-size:4rem;font-weight:800;color:#2c7be5;margin:20px 0}
.score-detail{font-size:1.3rem;color:#3d5068;margin-bottom:20px;background:#f3f8ff;padding:20px 30px;border-radius:30px;display:inline-block}
.restart-btn{background:#1e2b3c;color:#fff;padding:16px 48px;font-size:1.2rem;border-radius:40px;font-weight:600;cursor:pointer;border:none;margin-top:20px}
.hidden{display:none!important}
.subject-selector{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.subject-btn{background:#f0f4fa;border:2px solid #cbd8e9;border-radius:30px;padding:12px 28px;font-weight:600;cursor:pointer;transition:.15s}
.subject-btn:hover{background:#e0ecff;border-color:#2c7be5}
</style>
</head>
<body>
<div class="map-container">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="subjectView">
<div class="test-header"><span class="subject-badge">MAP 极限挑战</span><span class="question-counter">选择科目</span></div>
<div class="question-panel" style="text-align:center">
<div style="font-size:2rem;font-weight:600;margin:20px 0 10px;color:#0b1a2b">🔥 硬核自适应挑战</div>
<div style="font-size:1.1rem;color:#3d5068;margin-bottom:20px">包含长篇学术阅读 · 选项绝对乱序</div>
<div class="subject-selector" id="subjectSelector"></div>
</div>
</div>
<div id="quizView" class="hidden">
<div class="test-header"><span class="subject-badge" id="subjectBadge">Math</span><span class="question-counter" id="questionCounter">Question 1 / 40</span><span class="difficulty-indicator" id="difficultyDisplay">难度 5</span></div>
<div class="question-panel">
<div class="question-text" id="questionText"></div>
<div class="options-grid" id="optionsContainer"></div>
<div class="feedback-area" id="feedbackArea">选择一个答案</div>
</div>
<div class="action-buttons"><button class="btn btn-outline" id="skipBtn">跳过</button><button class="btn btn-primary" id="nextBtn" disabled>下一题</button></div>
</div>
<div id="resultView" class="hidden">
<div class="result-screen">
<h2>✅ 测试完成</h2>
<div class="score-big" id="finalScore">0</div>
<div class="score-detail" id="finalDetail">0 / 40 正确</div>
<div style="margin-bottom:30px;font-size:1.1rem;color:#1e2b3c" id="difficultyResult"></div>
<button class="restart-btn" id="restartBtn">返回科目选择</button>
</div>
</div>
</div>
<script>
// 洗牌引擎：彻底修复全选A
function shuffleOpts(ans,wrongs){let o=[ans,...wrongs];for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return{options:o,answerIndex:o.indexOf(ans)};}
// 题库生成
function genBank(){
const b={Math:[],'Language Usage':[],Reading:[],Science:[]};
const shuffleArr=a=>a.sort(()=>Math.random()-.5);
// 数学
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=3){if(v===0){q=`Solve: ${d+i+1}x² - ${d*4}x = 0 (x>0)`;ans=`${(d*4)/(d+i+1)}`;wrongs=[`${d*2/(d+i+1)}`,`${d*4}`,`${(d+i+1)/2}`]}else if(v===1){q=`Inverse of f(x) = ${d}x - ${i+2}`;ans=`(x+${i+2})/${d}`;wrongs=[`(x-${i+2})/${d}`,`${d}x+${i+2}`,`x/${d}+${i+2}`]}else if(v===2){q=`Det of [[${d+2},${i+1}],[${i+1},${d+2}]]`;ans=`${(d+2)*(d+2)-(i+1)*(i+1)}`;wrongs=[`${(d+2)*(d+2)+(i+1)*(i+1)}`,`${(d+2)*(i+1)}`,`0`]}else{q=`Sum of roots of ${d}x² - ${d*3}x + ${d}=0?`;ans=`3`;wrongs=[`-3`,`${d}`,`${3/d}`]}}
else if(d<=7){if(v===0){q=`lim(x→0) sin(${d}x)/${i+2}x`;ans=`${d}/${i+2}`;wrongs=[`${i+2}/${d}`,`1`,`0`]}else if(v===1){q=`Derivative of ${d+i}x³ + ${d*2}x²`;ans=`${(d+i)*3}x²+${d*4}x`;wrongs=[`${d+i}x²+${d*2}x`,`${(d+i)*3}x²+${d*2}x`,`${(d+i)*3}x³+${d*4}x²`]}else if(v===2){q=`log₂(x) + log₂(${d}) = 5. x?`;ans=`${32/d}`;wrongs=[`${32*d}`,`${32-d}`,`${d*5}`]}else{q=`Vertex of y = ${d}(x-${i+1})² - ${d*2}`;ans=`(${i+1}, -${d*2})`;wrongs=[`(-${i+1}, -${d*2})`,`(${i+1}, ${d*2})`,`(-${i+1}, ${d*2})`]}}
else{if(v===0){q=`∫ (${d}x² + ${i}x) dx`;ans=`(${d}/3)x³+(${i}/2)x²+C`;wrongs=[`${d}x³+${i}x²+C`,`(${d}/2)x²+${i}x+C`,`${d}x²+${i}x+C`]}else if(v===1){q=`f(x)=e^(${d}x). f''(x)?`;ans=`${d*d}e^(${d}x)`;wrongs=[`${d}e^(${d}x)`,`e^(${d}x)`,`${d*d}xe^(${d}x)`]}else if(v===2){q=`Eigenvalues of [[${d},0],[0,${d+1}]]`;ans=`${d} and ${d+1}`;wrongs=[`${d} and ${d}`,`${d+1} and ${d+1}`,`${d} and 0`]}else{q=`Prob sum ${d%6+2} with two dice?`;ans=`${(d%6<1?6:d%6)}/36`;wrongs=[`1/6`,`1/12`,`2/36`]}}
let op=shuffleOpts(ans,wrongs);b.Math.push({subject:'Math',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Math=shuffleArr(b.Math);
// 语言
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=3){if(v===0){q=`Error: "The professor, along with his students, were attending."`;ans=`were attending`;wrongs=[`The professor`,`along with`,`the conference`]}else if(v===1){q=`Word: The CEO's decision was ______, ignoring advice.`;ans=`intransigent`;wrongs=[`amenable`,`pliable`,`docile`]}else if(v===2){q=`Subjunctive mood used correctly?`;ans=`I demand that he be present.`;wrongs=[`I demand that he is present.`,`I demand that he was present.`,`I demand that he will be present.`]}else{q=`Meaning of "obfuscate"?`;ans=`To make unclear`;wrongs=[`To clarify`,`To praise`,`To criticize`]}}
else if(d<=7){if(v===0){q=`Device: "The pen is mightier than the sword."`;ans=`Metonymy`;wrongs=[`Simile`,`Personification`,`Hyperbole`]}else if(v===1){q=`Word: The argument was so ______ it convinced experts.`;ans=`cogent`;wrongs=[`tenuous`,`fallacious`,`specious`]}else if(v===2){q=`Fix dangling modifier: "Having finished the assignment, the TV was turned on."`;ans=`Having finished the assignment, I turned on the TV.`;wrongs=[`The TV was turned on having finished the assignment.`,`Having finished the assignment, the TV turned on.`,`The assignment finished, the TV was turned on.`]}else{q=`Tone: "The proposal is a masterful exercise in obfuscation."`;ans=`Critical`;wrongs=[`Admiring`,`Humorous`,`Neutral`]}}
else{if(v===0){q=`Inversion type: "Not only did he forget keys, but he lost his wallet."`;ans=`Negative inversion`;wrongs=[`Locative inversion`,`Conditional inversion`,`Subject-verb inversion`]}else if(v===1){q=`Word: The medicine's ______ effects were felt.`;ans=`salutary`;wrongs=[`deleterious`,`insidious`,`baneful`]}else if(v===2){q=`Plural of "phenomenon"?`;ans=`phenomena`;wrongs=[`phenomenons`,`phenomenae`,`phenomenas`]}else{q=`Fallacy: "You can't trust his economics because he's not an economist."`;ans=`Ad hominem`;wrongs=[`Straw man`,`False dilemma`,`Slippery slope`]}}
let op=shuffleOpts(ans,wrongs);b['Language Usage'].push({subject:'Language Usage',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b['Language Usage']=shuffleArr(b['Language Usage']);
// 长篇阅读
const readPassages=[
{text:`The proliferation of digital echo chambers has fundamentally altered the epistemological landscape of modern democracies. Rather than fostering a vibrant marketplace of ideas, algorithmic curation creates insulated realities where confirmation bias is not merely a psychological tendency but an engineered feature. The result is an epistemic crisis where objective truth is subordinated to tribal identity. This fragmentation does not simply create disagreement; it destroys the shared factual basis necessary for democratic deliberation, replacing it with competing, incommensurable narratives.`,q:`Based on the passage, what is the ultimate consequence of algorithmic echo chambers on democracy?`,a:`They destroy the shared factual basis required for democratic deliberation.`,w:[`They increase healthy competition among different political factions.`,`They eliminate confirmation bias through continuous exposure to data.`,`They foster a vibrant marketplace of ideas by decentralizing information.`]},
{text:`The replication crisis in psychological science is not merely a methodological hiccup; it represents a profound challenge to the discipline's epistemological foundations. The inherent variability of human behavior, coupled with a systemic publication bias favoring novel, positive results, has cultivated a landscape where many classic findings are likely artifacts of statistical noise. This realization forces researchers to confront an uncomfortable truth: psychology's historical reliance on small sample sizes and p-hacking has severely compromised the robustness of its cumulative knowledge base.`,q:`What is the author's primary argument regarding the replication crisis?`,a:`It exposes deep epistemological flaws in psychological research methodology.`,w:[`It is a minor issue easily resolved by simply increasing sample sizes.`,`It proves that all historical psychological findings are completely fraudulent.`,`It demonstrates that human behavior is entirely unpredictable and chaotic.`]},
{text:`In the realm of quantum mechanics, the Einstein-Podolsky-Rosen (EPR) paradox was formulated to argue that the quantum-mechanical description of physical reality was incomplete. Einstein famously derided quantum entanglement as "spooky action at a distance," believing it implied faster-than-light communication, a violation of special relativity. However, Bell's theorem later demonstrated that no local hidden-variable theory could reproduce the predictions of quantum mechanics, forcing physicists to abandon local realism and accept entanglement as a fundamental, albeit non-intuitive, feature of the universe.`,q:`According to the passage, what was the significance of Bell's theorem?`,a:`It demonstrated that local hidden-variable theories are incompatible with quantum mechanics.`,w:[`It proved that Einstein's theory of special relativity was fundamentally flawed.`,`It confirmed that faster-than-light communication is indeed possible via entanglement.`,`It validated the EPR paradox by showing that quantum mechanics is incomplete.`]},
{text:`The existentialist notion that "existence precedes essence" is a radical departure from classical philosophical traditions. For Sartre, this means that humanity is condemned to be free; we are thrust into a meaningless universe and must forge our own meaning through authentic choices. This freedom, however, is accompanied by profound anguish, as we bear the total responsibility for our actions and, by extension, for the world we create. To escape this responsibility through "bad faith" (mauvaise foi) is to deny one's own freedom, reducing oneself to a mere object.`,q:`What does Sartre mean by "bad faith" in the context of the passage?`,a:`Denying one's inherent freedom and responsibility to avoid existential anguish.`,w:[`Believing in a higher power that dictates human destiny and purpose.`,`Acting immorally against the established norms of society.`,`Rejecting the idea that life has any inherent meaning or purpose.`]},
{text:`The economic history of the Industrial Revolution is often framed as a triumph of technological innovation, but this narrative obscures the profound social upheaval it entailed. The enclosure movement and the subsequent migration of rural populations to urban centers created a vast, exploitable labor force. While the factory system undoubtedly generated unprecedented wealth, it simultaneously entrenched systemic inequalities and subjected workers to brutal, dehumanizing conditions. The transition to industrial capitalism was not merely an economic shift; it was a violent restructuring of human existence.`,q:`What is the author's main critique of the traditional narrative of the Industrial Revolution?`,a:`It overlooks the severe social costs and systemic inequalities accompanying the economic shift.`,w:[`It overstates the role of technological innovation in generating wealth.`,`It fails to acknowledge the economic benefits of the enclosure movement.`,`It exaggerates the dehumanizing conditions experienced by the factory workers.`]}
];
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let p=readPassages[i%readPassages.length],q=p.q;
if(i>=readPassages.length){q=i%2===0?`According to the passage, which statement is best supported?`:`What can be inferred about the author's perspective?`}
let op=shuffleOpts(p.a,p.w);b.Reading.push({subject:'Reading',question:`Passage:\n${p.text}\n\nQuestion: ${q}`,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Reading=shuffleArr(b.Reading);
// 科学
for(let d=1;d<=10;d++){for(let i=0;i<40;i++){let q,ans,wrongs,v=i%4;
if(d<=3){if(v===0){q=`Function of mitochondria?`;ans=`ATP production`;wrongs=[`Protein synthesis`,`Lipid storage`,`DNA replication`]}else if(v===1){q=`Law: energy cannot be created/destroyed?`;ans=`First law of thermodynamics`;wrongs=[`Second law`,`Newton's second law`,`Law of conservation of mass`]}else if(v===2){q=`Geometry of methane (CH4)?`;ans=`Tetrahedral`;wrongs=[`Trigonal planar`,`Linear`,`Bent`]}else{q=`Organelle for protein synthesis?`;ans=`Ribosome`;wrongs=[`Golgi apparatus`,`Lysosome`,`Nucleus`]}}
else if(d<=7){if(v===0){q=`Superposition principle?`;ans=`A system can exist in multiple states simultaneously until measured.`;wrongs=[`Particles cannot occupy the same quantum state simultaneously.`,`Energy is quantized in discrete packets.`,`Observation has no effect on the quantum state.`]}else if(v===1){q=`Best describes an enzyme?`;ans=`A biological catalyst that lowers activation energy.`;wrongs=[`A molecule that increases activation energy.`,`A structural protein providing cellular support.`,`A lipid molecule that stores energy.`]}else if(v===2){q=`Difference between ionic and covalent bonds?`;ans=`Ionic bonds transfer electrons, covalent bonds share them.`;wrongs=[`Ionic bonds share electrons, covalent bonds transfer them.`,`Both involve the complete transfer of electrons.`,`Both involve the sharing of electrons equally.`]}else{q=`Heisenberg Uncertainty Principle?`;ans=`It is impossible to simultaneously know both the exact position and momentum of a particle.`;wrongs=[`Particles can have both exact position and momentum simultaneously.`,`Energy and time can be measured precisely at the same time.`,`Electrons orbit the nucleus in perfectly defined paths.`]}}
else{if(v===0){q=`Role of Pauli exclusion principle?`;ans=`No two electrons can have the same four quantum numbers.`;wrongs=[`Electrons can occupy the same quantum state.`,`It explains the quantization of energy levels.`,`It describes the wave-particle duality of electrons.`]}else if(v===1){q=`SN2 reaction mechanism?`;ans=`A concerted nucleophilic substitution with inversion of stereochemistry.`;wrongs=[`A stepwise reaction involving a carbocation intermediate.`,`An elimination reaction forming a double bond.`,`A radical substitution reaction initiated by light.`]}else if(v===2){q=`Function of ATP synthase in cellular respiration?`;ans=`To synthesize ATP using the proton motive force.`;wrongs=[`To break down glucose into pyruvate.`,`To transport electrons in the electron transport chain.`,`To store oxygen in muscle cells.`]}else{q=`Significance of second law of thermodynamics?`;ans=`The total entropy of an isolated system can never decrease over time.`;wrongs=[`Energy is always conserved in a closed system.`,`Heat flows spontaneously from cold to hot bodies.`,`The entropy of a system decreases during a spontaneous process.`]}}
let op=shuffleOpts(ans,wrongs);b.Science.push({subject:'Science',question:q,options:op.options,answerIndex:op.answerIndex,difficulty:d});}}
b.Science=shuffleArr(b.Science);
return b;
}
const questionBank=genBank();
// 游戏逻辑
let currentSubject='Math',currentQuestion=null,currentIndex=0,currentDifficulty=5,correctCount=0,usedQuestions=[];
const TOTAL=40;
const subjectView=document.getElementById('subjectView'),quizView=document.getElementById('quizView'),resultView=document.getElementById('resultView');
const subjectSelector=document.getElementById('subjectSelector'),subjectBadge=document.getElementById('subjectBadge');
const questionCounter=document.getElementById('questionCounter'),difficultyDisplay=document.getElementById('difficultyDisplay');
const questionText=document.getElementById('questionText'),optionsContainer=document.getElementById('optionsContainer');
const feedbackArea=document.getElementById('feedbackArea'),nextBtn=document.getElementById('nextBtn'),skipBtn=document.getElementById('skipBtn');
const progressFill=document.getElementById('progressFill'),finalScore=document.getElementById('finalScore'),finalDetail=document.getElementById('finalDetail');
const difficultyResult=document.getElementById('difficultyResult'),restartBtn=document.getElementById('restartBtn');
function initSubjectView(){subjectView.classList.remove('hidden');quizView.classList.add('hidden');resultView.classList.add('hidden');progressFill.style.width='0%';subjectSelector.innerHTML='';['Math','Language Usage','Reading','Science'].forEach(sub=>{const btn=document.createElement('button');btn.className='subject-btn';btn.textContent=sub;btn.onclick=()=>startQuiz(sub);subjectSelector.appendChild(btn);});}
function startQuiz(subject){currentSubject=subject;subjectView.classList.add('hidden');quizView.classList.remove('hidden');resultView.classList.add('hidden');currentIndex=0;currentDifficulty=5;correctCount=0;usedQuestions=[];loadNextQuestion();}
function pickQuestion(diff){const bank=questionBank[currentSubject];let candidates=bank.filter(q=>!usedQuestions.includes(q)&&q.difficulty===diff);if(candidates.length===0){let minDiff=100;bank.forEach(q=>{if(!usedQuestions.includes(q))minDiff=Math.min(minDiff,Math.abs(q.difficulty-diff));});candidates=bank.filter(q=>!usedQuestions.includes(q)&&Math.abs(q.difficulty-diff)===minDiff);}return candidates.length>0?candidates[Math.floor(Math.random()*candidates.length)]:null;}
function loadNextQuestion(){if(currentIndex>=TOTAL){showResult();return;}const q=pickQuestion(currentDifficulty);if(!q){showResult();return;}currentQuestion=q;usedQuestions.push(q);subjectBadge.textContent=currentSubject;questionCounter.textContent=`Question ${currentIndex+1} / ${TOTAL}`;difficultyDisplay.textContent=`难度 ${currentDifficulty}`;questionText.textContent=q.question;optionsContainer.innerHTML='';q.options.forEach((opt,idx)=>{const btn=document.createElement('button');btn.className='option-btn';btn.innerHTML=`<span class="option-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span>`;btn.onclick=()=>handleAnswer(idx);optionsContainer.appendChild(btn);});feedbackArea.textContent='选择一个答案';feedbackArea.className='feedback-area';nextBtn.disabled=true;skipBtn.disabled=false;nextBtn.textContent=currentIndex===TOTAL-1?'完成测试':'下一题';progressFill.style.width=`${(currentIndex/TOTAL)*100}%`;}
function handleAnswer(selectedIdx){if(!nextBtn.disabled)return;const isCorrect=selectedIdx===currentQuestion.answerIndex;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===selectedIdx)btn.classList.add(isCorrect?'correct':'wrong');if(idx===currentQuestion.answerIndex&&idx!==selectedIdx)btn.classList.add('correct');});if(isCorrect){feedbackArea.textContent='✅ 正确！';feedbackArea.className='feedback-area correct-feedback';correctCount++;currentDifficulty=Math.min(10,currentDifficulty+1);}else{feedbackArea.textContent=`❌ 错误。正确答案: ${['A','B','C','D'][currentQuestion.answerIndex]}. ${currentQuestion.options[currentQuestion.answerIndex]}`;feedbackArea.className='feedback-area wrong-feedback';currentDifficulty=Math.max(1,currentDifficulty-1);}difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;}
skipBtn.onclick=()=>{if(skipBtn.disabled)return;const q=currentQuestion;document.querySelectorAll('.option-btn').forEach((btn,idx)=>{btn.disabled=true;if(idx===q.answerIndex)btn.classList.add('correct');});feedbackArea.textContent=`⏭️ 已跳过。正确答案: ${['A','B','C','D'][q.answerIndex]}. ${q.options[q.answerIndex]}`;feedbackArea.className='feedback-area';currentDifficulty=Math.max(1,currentDifficulty-1);difficultyDisplay.textContent=`难度 ${currentDifficulty}`;nextBtn.disabled=false;skipBtn.disabled=true;};
nextBtn.onclick=()=>{currentIndex++;loadNextQuestion();};
function showResult(){quizView.classList.add('hidden');resultView.classList.remove('hidden');progressFill.style.width='100%';const accuracy=correctCount/TOTAL;const difficultyScore=(currentDifficulty/10);let finalScoreVal=Math.round((accuracy*210)+(difficultyScore*140));finalScoreVal=Math.min(350,finalScoreVal);finalScore.textContent=finalScoreVal;finalDetail.textContent=`正确 ${correctCount} / ${TOTAL} 题 · 最终难度 ${currentDifficulty}/10`;difficultyResult.textContent=`得分配比：正确率得分 (${Math.round(accuracy*210)}) + 难度得分 (${Math.round(difficultyScore*140)})`;}
restartBtn.onclick=initSubjectView;initSubjectView();
</script>
</body>
</html>
