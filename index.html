<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP 极限自适应测试 · 每科每难度40模板 · Reading词数阶梯</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0}
body{background:linear-gradient(145deg,#1e2b3c,#0f1a26);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.map-container{max-width:1150px;width:100%;background:#fff;border-radius:36px;box-shadow:0 30px 50px rgba(0,0,0,.6);overflow:hidden}
.progress-bar{background:#d9e2ec;height:8px;width:100%}
.progress-fill{height:8px;width:0;background:#2c7be5;transition:width .3s}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 12px;border-bottom:2px solid #eef2f7;flex-wrap:wrap;gap:10px}
.subject-badge{background:#1e2b3c;color:#fff;font-weight:600;padding:8px 20px;border-radius:40px}
.question-counter,.difficulty-indicator{color:#4a5a6e;font-weight:600;background:#f0f4fa;padding:8px 20px;border-radius:40px}
.question-panel{padding:32px 40px 24px}
.question-text{font-size:1.15rem;font-weight:500;color:#0b1a2b;line-height:1.7;margin-bottom:30px;white-space:pre-wrap;max-height:380px;overflow-y:auto;padding-right:10px}
.options-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.question-panel.split-view{display:flex;gap:20px;max-height:650px}
.question-panel.split-view .question-text{flex:1.2;font-size:1rem;line-height:1.6;max-height:600px;padding-right:15px;border-right:2px solid #eef2f7;white-space:pre-wrap;overflow-y:auto;margin-bottom:0}
.question-panel.split-view .options-grid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;margin-bottom:0;max-height:600px;overflow-y:auto;padding-left:5px}
.option-btn{background:#f9fcff;border:2px solid #d0ddea;border-radius:20px;padding:18px 28px;font-size:1rem;font-weight:500;color:#1a2c3f;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:18px}
.option-btn:hover:not(:disabled){background:#e7f0fd;border-color:#2c7be5;transform:translateY(-2px)}
.option-btn.correct{background:#d7f0e0;border-color:#1e8e5e;color:#0c4a2e}
.option-btn.wrong{background:#ffe5e5;border-color:#d43b3b;color:#7a1f1f}
.option-btn:disabled{cursor:default;opacity:.95}
.option-letter{font-weight:700;background:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1e2b3c;flex-shrink:0}
.option-btn.correct .option-letter{background:#1e8e5e;color:#fff}
.option-btn.wrong .option-letter{background:#d43b3b;color:#fff}
.feedback-area{background:#f3f7fe;border-radius:18px;padding:18px 24px;margin:10px 0 20px;font-size:1.1rem;color:#0e2b4a;display:flex;border-left:6px solid #2c7be5;min-height:60px;font-weight:500}
.feedback-area.correct-feedback{background:#e6f7ef;border-left-color:#1e8e5e;color:#0b4b2e}
.feedback-area.wrong-feedback{background:#ffefef;border-left-color:#d43b3b;color:#7a1f1f}
.action-buttons{display:flex;gap:16px;justify-content:flex-end;padding:8px 40px 40px}
.btn{border:none;font-weight:600;font-size:1.2rem;padding:16px 34px;border-radius:40px;cursor:pointer;transition:.15s}
.btn-primary{background:#2c7be5;color:#fff;box-shadow:0 8px 18px rgba(44,123,229,.3)}
.btn-primary:disabled{background:#b6c9e0;cursor:not-allowed;box-shadow:none}
.btn-outline{background:#fff;border:2px solid #cbd8e9;color:#1e2b3c}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.result-screen{padding:48px 40px;text-align:center}
.score-big{font-size:4rem;font-weight:800;color:#2c7be5;margin:20px 0}
.score-detail{font-size:1.3rem;color:#3d5068;margin-bottom:20px;background:#f3f8ff;padding:20px 30px;border-radius:30px;display:inline-block}
.restart-btn{background:#1e2b3c;color:#fff;padding:16px 48px;font-size:1.2rem;border-radius:40px;font-weight:600;cursor:pointer;border:none;margin-top:20px}
.hidden{display:none!important}
.subject-selector{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
.subject-btn{background:#f0f4fa;border:2px solid #cbd8e9;border-radius:30px;padding:12px 28px;font-weight:600;cursor:pointer;transition:.15s;font-size:1.1rem}
.subject-btn:hover{background:#e0ecff;border-color:#2c7be5}
</style>
</head>
<body>
<div class="map-container">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="subjectView">
    <div class="test-header"><span class="subject-badge">MAP 挑战</span><span class="question-counter">选择科目</span></div>
    <div class="question-panel" style="text-align:center">
        <div style="font-size:2rem;font-weight:600;margin:20px 0 10px;color:#0b1a2b">🔥 极限自适应挑战</div>
        <div style="font-size:1rem;color:#3d5068;margin-bottom:20px">Reading 难度 D → 约 D×100 词文章 · 全科海量真题</div>
        <div class="subject-selector">
            <button class="subject-btn" onclick="startQuiz('Math')">Math</button>
            <button class="subject-btn" onclick="startQuiz('Language Usage')">Language Usage</button>
            <button class="subject-btn" onclick="startQuiz('Reading')">Reading</button>
            <button class="subject-btn" onclick="startQuiz('Science')">Science</button>
        </div>
    </div>
</div>

<div id="quizView" class="hidden">
<div class="test-header"><span class="subject-badge" id="subjectBadge">Math</span><span class="question-counter" id="questionCounter">Question 1 / 40</span><span class="difficulty-indicator" id="difficultyDisplay">难度 1</span></div>
<div class="question-panel" id="questionPanelContainer">
<div class="question-text" id="questionText"></div>
<div class="options-grid" id="optionsContainer"></div>
<div class="feedback-area" id="feedbackArea">选择一个答案</div>
</div>
<div class="action-buttons"><button class="btn btn-outline" id="skipBtn" onclick="skipQuestion()">跳过</button><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button></div>
</div>

<div id="resultView" class="hidden">
<div class="result-screen">
<h2>✅ 测试完成</h2>
<div class="score-big" id="finalScore">0</div>
<div class="score-detail" id="finalDetail">0 / 40 正确</div>
<div style="margin-bottom:30px;font-size:1.1rem;color:#1e2b3c" id="difficultyResult"></div>
<button class="restart-btn" onclick="restartQuiz()">返回科目选择</button>
</div>
</div>
</div>

<script>
// ================= 通用工具 =================
var questionBank = { Math: [], 'Language Usage': [], Reading: [], Science: [] };

function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function createOptions(correctAns, baseWrongs) {
    var seen = new Set([correctAns]);
    var wrongs = [];
    baseWrongs.forEach(function(w) {
        if (!seen.has(w)) { seen.add(w); wrongs.push(w); }
    });
    while (wrongs.length < 3) wrongs.push("None of the above " + Math.floor(Math.random()*10000));
    var allOpts = [correctAns].concat(wrongs.slice(0,3));
    var shuffledOpts = shuffleArray(allOpts);
    return { options: shuffledOpts, answerIndex: shuffledOpts.indexOf(correctAns) };
}

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ================= 题库构建 =================
// 每科每难度恰好 40 道不同模板题
function buildBank() {
    buildMath();
    buildLanguage();
    buildReading();
    buildScience();
}

// ---------- Math: 10 难度 × 40 模板 ----------
function buildMath() {
    var mathList = [];
    for (var d = 1; d <= 10; d++) {
        for (var i = 0; i < 40; i++) {
            var tag, q, a, w;
            var n1 = rnd(1, d*10+10), n2 = rnd(1, d*10+10);
            var type = i % 10;
            switch(type) {
                case 0: // 加法
                    q = "Calculate: " + n1 + " + " + n2 + " = ?";
                    a = "" + (n1+n2);
                    w = ["" + (n1+n2+1), "" + (n1+n2-2), "" + (n1+n2+5)];
                    tag = 'math-add'; break;
                case 1: // 减法
                    var big = Math.max(n1, n2), small = Math.min(n1, n2);
                    q = "Calculate: " + big + " - " + small + " = ?";
                    a = "" + (big - small);
                    w = ["" + (big - small + 1), "" + (big - small - 1), "" + (big + small)];
                    tag = 'math-sub'; break;
                case 2: // 乘法
                    var m1 = rnd(1, d*5+5), m2 = rnd(1, d*5+5);
                    q = "Calculate: " + m1 + " × " + m2 + " = ?";
                    a = "" + (m1*m2);
                    w = ["" + (m1*m2+m1), "" + (m1*m2-m2), "" + (m1+m2)];
                    tag = 'math-mul'; break;
                case 3: // 除法
                    var divB = rnd(2, d*4+4), divQ = rnd(2, d*4+4), divA = divB*divQ;
                    q = "Calculate: " + divA + " ÷ " + divB + " = ?";
                    a = "" + divQ;
                    w = ["" + (divQ+1), "" + (divQ-1), "" + (divQ+2)];
                    tag = 'math-div'; break;
                case 4: // 方程
                    var x = rnd(2, d*3+3), coeff = rnd(2, d+5), rhs = coeff*x + rnd(1,20);
                    q = "Solve for x: " + coeff + "x + " + (rhs - coeff*x) + " = " + rhs;
                    a = "" + x;
                    w = ["" + (x+1), "" + (x-1), "" + (x+2)];
                    tag = 'math-eq'; break;
                case 5: // 面积
                    var ww = rnd(2, d*5+5), hh = rnd(2, d*5+5);
                    q = "Area of a rectangle with width " + ww + " and length " + hh + "?";
                    a = "" + (ww*hh);
                    w = ["" + (ww+hh), "" + (2*(ww+hh)), "" + (ww*hh+3)];
                    tag = 'math-area'; break;
                case 6: // 导数
                    var da = rnd(2, d+5), db = rnd(1, d+5);
                    q = "Derivative of " + da + "x² + " + db + "x?";
                    a = "" + (2*da) + "x + " + db;
                    w = ["" + da + "x + " + db, "" + (2*da) + "x", "" + da + "x² + " + db];
                    tag = 'math-deriv'; break;
                case 7: // 积分
                    var ia = rnd(2, d*2+4);
                    q = "∫ " + ia + "x dx = ?";
                    a = "" + (ia/2) + "x² + C";
                    w = ["" + ia + "x² + C", "" + (ia/2) + "x + C", "" + ia + "x + C"];
                    tag = 'math-integ'; break;
                case 8: // 极限
                    var la = rnd(1, d+3), lb = rnd(1, d+3);
                    q = "lim(x→0) sin(" + la + "x)/(" + lb + "x) = ?";
                    a = "" + (la/lb);
                    w = ["" + (lb/la), "1", "0"];
                    tag = 'math-limit'; break;
                default: // 行列式
                    var det = rnd(2, d+4);
                    q = "Determinant of [[" + det + ", 1], [1, " + det + "]] = ?";
                    a = "" + (det*det - 1);
                    w = ["" + (det*det + 1), "" + det, "0"];
                    tag = 'math-det'; break;
            }
            mathList.push({ q: q, a: a, w: w, d: d, tag: tag + '-' + d + '-' + i });
        }
    }
    addUniqueQuestions('Math', mathList);
}

// ---------- Language Usage: 10 难度 × 40 模板 ----------
function buildLanguage() {
    var langList = [];
    var contexts = ["[Literature] ","[Formal] ","[Everyday] ","[Academic] ","[Business] ","[Journalism] ","[Legal] ","[Scientific] ","[Historical] ","[Philosophical] "];
    for (var d = 1; d <= 10; d++) {
        for (var i = 0; i < 40; i++) {
            var ctx = contexts[i % contexts.length];
            var tag, q, a, w;
            var variant = i % 8;
            if (d <= 2) {
                if (variant % 2 === 0) {
                    var subj = pick(['They','We','You','He','She','It']);
                    var verb = pick(['are','were','have been','will be']);
                    q = ctx + "Choose the correct pronoun: ___ " + verb + " ready.";
                    a = subj;
                    w = [pick(['Them','Their','There',"They're"]), pick(['Him','His',"He's"]), pick(['Us','Our',"We're"])];
                    tag = 'lang-pronoun';
                } else {
                    var base = pick(['run','walk','eat','write','swim','go','see','take','give','make']);
                    var pastMap = {run:'ran',walk:'walked',eat:'ate',write:'wrote',swim:'swam',go:'went',see:'saw',take:'took',give:'gave',make:'made'};
                    q = ctx + "What is the past tense of '" + base + "'?";
                    a = pastMap[base];
                    w = [base + 'ed', base + 'ing', base + 's'];
                    tag = 'lang-tense';
                }
            } else if (d <= 4) {
                if (variant % 2 === 0) {
                    q = ctx + "Find the error: 'Neither of the girls were ready.'";
                    a = "were";
                    w = ["Neither", "girls", "ready"];
                    tag = 'lang-error';
                } else {
                    q = ctx + "Which sentence uses a colon correctly?";
                    a = "He had one goal: to win.";
                    w = ["He had: one goal.", "He had one goal; to win.", "He had one goal, to: win."];
                    tag = 'lang-colon';
                }
            } else if (d <= 6) {
                if (variant % 2 === 0) {
                    q = ctx + "Fix the dangling modifier: 'Walking down the street, the trees were beautiful.'";
                    a = "Walking down the street, I saw beautiful trees.";
                    w = ["The trees were beautiful walking down the street.", "Walking down the street, the trees were.", "The street had beautiful trees walking."];
                    tag = 'lang-modifier';
                } else {
                    q = ctx + "Identify the clause type: 'Whoever finishes first will win.'";
                    a = "Noun clause";
                    w = ["Adjective clause", "Adverb clause", "Independent clause"];
                    tag = 'lang-clause';
                }
            } else if (d <= 8) {
                if (variant % 2 === 0) {
                    q = ctx + "What logical fallacy is: 'Either you support this or you are unpatriotic.'?";
                    a = "False dilemma";
                    w = ["Ad hominem", "Straw man", "Slippery slope"];
                    tag = 'lang-fallacy';
                } else {
                    q = ctx + "What type of inversion is: 'Seldom have I seen such courage.'?";
                    a = "Negative inversion";
                    w = ["Locative inversion", "Conditional inversion", "Comparative inversion"];
                    tag = 'lang-inversion';
                }
            } else {
                if (variant % 2 === 0) {
                    q = ctx + "What does 'to gild the lily' mean?";
                    a = "Unnecessarily embellish";
                    w = ["To ruin a good thing", "To hide the truth", "To praise excessively"];
                    tag = 'lang-idiom';
                } else {
                    q = ctx + "What syntax type is: 'Hardly had he arrived when the storm broke.'?";
                    a = "Negative inversion";
                    w = ["Locative inversion", "Conditional inversion", "Subject-verb inversion"];
                    tag = 'lang-syntax';
                }
            }
            langList.push({ q: q, a: a, w: w, d: d, tag: tag + '-' + d + '-' + i });
        }
    }
    addUniqueQuestions('Language Usage', langList);
}

// ---------- Reading: 10 难度 × 40 模板，词数 ≈ 难度×100 ----------
function buildReading() {
    // 每个难度生成 40 篇不同文章（通过模板和参数变化）
    // 为控制代码量，使用 4 个基础模板 × 10 个主题变体 × 难度调整
    var readingList = [];
    var topics = [
        { name:'nature', kw:['sunlight','water','plants','oxygen','growth','forest','river','mountain','ocean','wind'] },
        { name:'tech', kw:['computer','algorithm','internet','data','software','network','digital','system','robot','signal'] },
        { name:'history', kw:['ancient','empire','king','war','trade','city','culture','revolution','artifact','century'] },
        { name:'science', kw:['atom','molecule','energy','gravity','cell','experiment','theory','particle','reaction','physics'] },
        { name:'society', kw:['community','law','education','family','government','economy','rights','public','change','tradition'] },
        { name:'health', kw:['body','exercise','nutrition','sleep','disease','medicine','brain','heart','stress','recovery'] },
        { name:'art', kw:['paint','music','story','poem','sculpture','color','rhythm','imagination','design','craft'] },
        { name:'environment', kw:['climate','pollution','recycle','species','habitat','ecosystem','carbon','sustain','biodiversity','conservation'] },
        { name:'psychology', kw:['mind','behavior','emotion','memory','learning','motivation','perception','thought','habit','personality'] },
        { name:'economy', kw:['market','money','supply','demand','trade','value','resource','investment','growth','policy'] }
    ];

    // 生成词数接近 targetWords 的段落
    function makePassage(words, seedIdx, d) {
        var t = topics[seedIdx % topics.length];
        var sentences = [
            "The study of {kw} has long fascinated researchers.",
            "In recent years, our understanding of {kw} has grown significantly.",
            "One important aspect of {kw} involves the interaction between different elements.",
            "For example, scientists have observed that {kw} can influence outcomes in unexpected ways.",
            "This finding challenges previous assumptions about {kw}.",
            "Further research is needed to fully understand the implications of {kw}.",
            "Experts agree that {kw} plays a crucial role in many natural and human systems.",
            "The complexity of {kw} makes it a rich area for investigation.",
            "Observations of {kw} have led to new theories and models.",
            "These developments have practical applications in various fields.",
            "Understanding {kw} requires careful analysis and long-term study.",
            "Many questions about {kw} remain unanswered.",
            "The evidence suggests that {kw} operates through multiple mechanisms.",
            "Researchers continue to explore the boundaries of {kw}.",
            "This knowledge can help address real-world challenges related to {kw}."
        ];
        // 构造尽可能多的句子直到达到词数
        var out = [];
        var currentWords = 0;
        var si = 0;
        while (currentWords < words) {
            var template = sentences[si % sentences.length];
            var kw = t.kw[si % t.kw.length];
            var sent = template.replace(/{kw}/g, kw);
            out.push(sent);
            currentWords += sent.split(' ').length;
            si++;
        }
        // 如果超出太多，尝试裁剪最后一句（简单处理）
        var text = out.join(' ');
        return text;
    }

    for (var d = 1; d <= 10; d++) {
        var targetWords = d * 100;
        for (var i = 0; i < 40; i++) {
            var seed = d * 7 + i * 13;
            var passage = makePassage(targetWords, seed, d);
            // 每个文章配一个理解题
            var t = topics[seed % topics.length];
            var qType = i % 4;
            var q, a, w;
            if (qType === 0) {
                q = "What is the passage mainly about?";
                a = "The study of " + t.kw[0] + " and its significance";
                w = ["The history of " + t.kw[1], "The decline of " + t.kw[2], "The dangers of " + t.kw[3]];
            } else if (qType === 1) {
                q = "According to the passage, what influences outcomes?";
                a = t.kw[0];
                w = [t.kw[1], t.kw[2], t.kw[3]];
            } else if (qType === 2) {
                q = "What do experts agree on regarding " + t.kw[0] + "?";
                a = "It plays a crucial role in many systems";
                w = ["It is irrelevant to modern science", "It has been fully understood", "It only affects human behavior"];
            } else {
                q = "What remains unanswered about " + t.kw[0] + "?";
                a = "Many questions remain";
                w = ["Everything is known", "It has no mechanisms", "It cannot be studied"];
            }
            var fullQ = "Passage (≈" + targetWords + " words, topic: " + t.name + "):\n" + passage + "\n\nQuestion: " + q;
            readingList.push({ q: fullQ, a: a, w: w, d: d, tag: 'reading-' + d + '-' + i, isLongPassage: d >= 5 });
        }
    }
    addUniqueQuestions('Reading', readingList);
}

// ---------- Science: 10 难度 × 40 模板 ----------
function buildScience() {
    var sciList = [];
    var sciCtxs = ["[General] ","[Physics] ","[Biology] ","[Chemistry] ","[Ecology] ","[Thermodynamics] ","[Quantum] ","[Genetics] ","[Organic] ","[Astrophysics] "];
    var baseTemplates = [
        { q:"Plants need what to make food?", a:"Sunlight, water, CO2", w:["Only sunlight","Only soil","Oxygen"], d:1, tag:'sci-photosyn' },
        { q:"What is the center of an atom?", a:"Nucleus", w:["Electron cloud","Proton shell","Neutron ring"], d:1, tag:'sci-atom' },
        { q:"Closest planet to the Sun?", a:"Mercury", w:["Venus","Earth","Mars"], d:2, tag:'sci-planet' },
        { q:"Water is made of?", a:"H and O", w:["C and O","O and N","H and He"], d:2, tag:'sci-water' },
        { q:"Function of mitochondria?", a:"ATP production", w:["Protein synthesis","Lipid storage","DNA replication"], d:3, tag:'sci-mito' },
        { q:"Newton's second law?", a:"F=ma", w:["E=mc²","PV=nRT","v=d/t"], d:3, tag:'sci-newton' },
        { q:"Most abundant gas in the atmosphere?", a:"Nitrogen", w:["Oxygen","CO2","Argon"], d:4, tag:'sci-gas' },
        { q:"What does DNA stand for?", a:"Deoxyribonucleic acid", w:["Dinucleic acid","Deoxyribose nucleic amino","Double nucleic acid"], d:4, tag:'sci-dna' },
        { q:"First law of thermodynamics?", a:"Energy is conserved", w:["Entropy always increases","F=ma","Action-reaction"], d:5, tag:'sci-thermo' },
        { q:"Role of enzymes?", a:"Decrease activation energy", w:["Increase activation energy","Provide energy","Consume energy"], d:5, tag:'sci-enzyme' },
        { q:"Mitosis produces how many cells?", a:"2", w:["4","1","8"], d:6, tag:'sci-mitosis' },
        { q:"Ribosome function?", a:"Protein synthesis", w:["Lipid synthesis","Carbohydrate storage","DNA replication"], d:6, tag:'sci-ribosome' },
        { q:"Heisenberg uncertainty principle?", a:"Cannot know both position and momentum exactly", w:["Can know both exactly","Energy is quantized","Light is a wave"], d:7, tag:'sci-heisenberg' },
        { q:"Ionic vs covalent bonds?", a:"Ionic transfers electrons, covalent shares", w:["Ionic shares, covalent transfers","Both share electrons","Both transfer electrons"], d:7, tag:'sci-bond' },
        { q:"ATP synthase role?", a:"Produce ATP", w:["Break down glucose","Store oxygen","Transport electrons"], d:8, tag:'sci-atp' },
        { q:"Pauli exclusion principle?", a:"No two fermions can occupy the same quantum state", w:["Bosons cannot share states","Electrons orbit in shells","Energy is conserved"], d:8, tag:'sci-pauli' },
        { q:"Krebs cycle role?", a:"Generate electron carriers", w:["Produce glucose","Break down fatty acids","Synthesize proteins"], d:9, tag:'sci-krebs' },
        { q:"Quantum number for orbital shape?", a:"Azimuthal (l)", w:["Principal (n)","Magnetic (m)","Spin (s)"], d:9, tag:'sci-quantum' },
        { q:"Catalyst effect?", a:"Lowers activation energy", w:["Increases activation energy","Changes equilibrium","Is consumed in reaction"], d:10, tag:'sci-catalyst' },
        { q:"What is entropy?", a:"A measure of disorder", w:["A measure of energy","A type of force","A particle"], d:10, tag:'sci-entropy' },
        { q:"Speed of light in vacuum?", a:"3 × 10⁸ m/s", w:["3 × 10⁶ m/s","3 × 10¹⁰ m/s","1 × 10⁸ m/s"], d:6, tag:'sci-light' },
        { q:"What organelle is the 'powerhouse' of the cell?", a:"Mitochondria", w:["Nucleus","Ribosome","Golgi apparatus"], d:3, tag:'sci-powerhouse' },
        { q:"What is the pH of pure water?", a:"7", w:["0","14","1"], d:4, tag:'sci-ph' },
        { q:"Which planet is known as the Red Planet?", a:"Mars", w:["Venus","Jupiter","Mercury"], d:2, tag:'sci-redplanet' },
        { q:"What is the formula for kinetic energy?", a:"½mv²", w:["mgh","Fd","mv"], d:7, tag:'sci-ke' },
        { q:"What molecule carries genetic information?", a:"DNA", w:["RNA","Protein","Lipid"], d:3, tag:'sci-genetic' },
        { q:"What is natural selection?", a:"Differential survival and reproduction", w:["Random mutation only","Genetic drift","Artificial breeding"], d:8, tag:'sci-selection' },
        { q:"What is a black hole?", a:"A region where gravity prevents light from escaping", w:["A star that has run out of fuel","A planet with no atmosphere","A type of galaxy"], d:9, tag:'sci-blackhole' },
        { q:"What is the function of the cell membrane?", a:"Regulates what enters and exits the cell", w:["Produces proteins","Stores genetic material","Generates ATP"], d:5, tag:'sci-membrane' },
        { q:"What is an isotope?", a:"Atoms with the same protons but different neutrons", w:["Atoms with different protons","Molecules with different bonds","Ions with different charges"], d:6, tag:'sci-isotope' }
    ];

    for (var d = 1; d <= 10; d++) {
        var pool = baseTemplates.filter(function(t){ return t.d === d; });
        if (pool.length === 0) pool = baseTemplates; // 兜底
        for (var i = 0; i < 40; i++) {
            var t = pool[i % pool.length];
            var ctx = sciCtxs[i % sciCtxs.length];
            // 轻微变体：添加语境前缀，确保 tag 唯一
            sciList.push({
                q: ctx + t.q,
                a: t.a,
                w: t.w.slice(),
                d: d,
                tag: t.tag + '-' + d + '-' + i
            });
        }
    }
    addUniqueQuestions('Science', sciList);
}

function addUniqueQuestions(subject, list) {
    var seen = new Set();
    list.forEach(function(t) {
        var key = t.q + "|" + t.a;
        if (!seen.has(key)) {
            seen.add(key);
            var op = createOptions(t.a, t.w);
            questionBank[subject].push({
                subject: subject,
                question: t.q,
                options: op.options,
                answerIndex: op.answerIndex,
                difficulty: t.d,
                isLongPassage: t.isLongPassage || false,
                tag: t.tag || ('d' + t.d)
            });
        }
    });
}

buildBank();

// ================= 测试逻辑 =================
var currentSubject = 'Math';
var currentQuestion = null;
var currentIndex = 0;
var currentDifficulty = 1;
var correctCount = 0;
var usedQuestions = [];
var usedTags = {};
var TOTAL = 40;

function startQuiz(subject) {
    currentSubject = subject;
    document.getElementById('subjectView').classList.add('hidden');
    document.getElementById('quizView').classList.remove('hidden');
    document.getElementById('resultView').classList.add('hidden');
    currentIndex = 0;
    currentDifficulty = 1;
    correctCount = 0;
    usedQuestions = [];
    usedTags = {};
    loadNextQuestion();
}

function loadNextQuestion() {
    if (currentIndex >= TOTAL) { showResult(); return; }
    var q = pickQuestion(currentDifficulty);
    if (!q) { showResult(); return; }
    currentQuestion = q;
    usedQuestions.push(q);
    if (!usedTags[q.tag]) usedTags[q.tag] = 0;
    usedTags[q.tag]++;

    document.getElementById('subjectBadge').textContent = currentSubject;
    document.getElementById('questionCounter').textContent = "Question " + (currentIndex + 1) + " / " + TOTAL;
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('questionText').textContent = q.question;

    var optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    q.options.forEach(function(opt, idx) {
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="option-letter">' + ['A','B','C','D'][idx] + '</span><span>' + opt + '</span>';
        btn.onclick = function() { handleAnswer(idx); };
        optionsContainer.appendChild(btn);
    });

    var panel = document.getElementById('questionPanelContainer');
    if (q.isLongPassage) panel.classList.add('split-view');
    else panel.classList.remove('split-view');

    document.getElementById('feedbackArea').textContent = '选择一个答案';
    document.getElementById('feedbackArea').className = 'feedback-area';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('skipBtn').disabled = false;
    document.getElementById('nextBtn').textContent = currentIndex === TOTAL - 1 ? '完成测试' : '下一题';
    document.getElementById('progressFill').style.width = ((currentIndex / TOTAL) * 100) + '%';
}

function pickQuestion(diff) {
    var bank = questionBank[currentSubject];
    var candidates = bank.filter(function(q) {
        return !usedQuestions.includes(q) && q.difficulty === diff;
    });
    if (candidates.length === 0) {
        var minDiff = 100;
        bank.forEach(function(q) {
            if (!usedQuestions.includes(q)) minDiff = Math.min(minDiff, Math.abs(q.difficulty - diff));
        });
        candidates = bank.filter(function(q) {
            return !usedQuestions.includes(q) && Math.abs(q.difficulty - diff) === minDiff;
        });
    }
    if (candidates.length === 0) return null;
    var minTagUse = Infinity;
    candidates.forEach(function(q) {
        var c = usedTags[q.tag] || 0;
        if (c < minTagUse) minTagUse = c;
    });
    var best = candidates.filter(function(q) { return (usedTags[q.tag] || 0) === minTagUse; });
    return best[Math.floor(Math.random() * best.length)];
}

function handleAnswer(selectedIdx) {
    if (!document.getElementById('nextBtn').disabled) return;
    var isCorrect = selectedIdx === currentQuestion.answerIndex;
    document.querySelectorAll('.option-btn').forEach(function(btn, idx) {
        btn.disabled = true;
        if (idx === selectedIdx) btn.classList.add(isCorrect ? 'correct' : 'wrong');
        if (idx === currentQuestion.answerIndex && idx !== selectedIdx) btn.classList.add('correct');
    });
    if (isCorrect) {
        document.getElementById('feedbackArea').textContent = '✅ 正确！';
        document.getElementById('feedbackArea').className = 'feedback-area correct-feedback';
        correctCount++;
        currentDifficulty = Math.min(10, currentDifficulty + 1);
    } else {
        document.getElementById('feedbackArea').textContent = "❌ 错误。正确答案: " + ['A','B','C','D'][currentQuestion.answerIndex] + ". " + currentQuestion.options[currentQuestion.answerIndex];
        document.getElementById('feedbackArea').className = 'feedback-area wrong-feedback';
        currentDifficulty = Math.max(1, currentDifficulty - 1);
    }
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('skipBtn').disabled = true;
}

function skipQuestion() {
    if (document.getElementById('skipBtn').disabled) return;
    var q = currentQuestion;
    document.querySelectorAll('.option-btn').forEach(function(btn, idx) {
        btn.disabled = true;
        if (idx === q.answerIndex) btn.classList.add('correct');
    });
    document.getElementById('feedbackArea').textContent = "⏭️ 已跳过。正确答案: " + ['A','B','C','D'][q.answerIndex] + ". " + q.options[q.answerIndex];
    document.getElementById('feedbackArea').className = 'feedback-area';
    currentDifficulty = Math.max(1, currentDifficulty - 1);
    document.getElementById('difficultyDisplay').textContent = "难度 " + currentDifficulty;
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('skipBtn').disabled = true;
}

function nextQuestion() {
    currentIndex++;
    loadNextQuestion();
}

function showResult() {
    document.getElementById('quizView').classList.add('hidden');
    document.getElementById('resultView').classList.remove('hidden');
    document.getElementById('progressFill').style.width = '100%';
    var accuracy = correctCount / TOTAL;
    var difficultyScore = currentDifficulty / 10;
    var finalScoreVal = Math.min(350, Math.round(accuracy * 210 + difficultyScore * 140));
    document.getElementById('finalScore').textContent = finalScoreVal;
    document.getElementById('finalDetail').textContent = "正确 " + correctCount + " / " + TOTAL + " 题 · 最终难度 " + currentDifficulty + "/10";
    document.getElementById('difficultyResult').textContent = "得分配比：正确率得分 (" + Math.round(accuracy * 210) + ") + 难度得分 (" + Math.round(difficultyScore * 140) + ")";
}

function restartQuiz() {
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('subjectView').classList.remove('hidden');
    document.getElementById('progressFill').style.width = '0%';
}
</script>
