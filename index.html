<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP 自适应练习 · 高分挑战版 (400题/科)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(145deg, #1e2b3c 0%, #0f1a26 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .map-container { max-width: 950px; width: 100%; background: #ffffff; border-radius: 36px; box-shadow: 0 30px 50px rgba(0,0,0,0.6); overflow: hidden; }
        .progress-bar { background: #d9e2ec; height: 8px; width: 100%; }
        .progress-fill { height: 8px; width: 0%; background: #2c7be5; transition: width 0.3s ease; }
        .test-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px 12px; border-bottom: 2px solid #eef2f7; flex-wrap: wrap; gap: 10px; }
        .subject-badge { background: #1e2b3c; color: white; font-weight: 600; padding: 8px 20px; border-radius: 40px; }
        .question-counter, .difficulty-indicator { color: #4a5a6e; font-weight: 600; background: #f0f4fa; padding: 8px 20px; border-radius: 40px; }
        .question-panel { padding: 32px 40px 24px; }
        .question-text { font-size: 1.4rem; font-weight: 500; color: #0b1a2b; line-height: 1.5; margin-bottom: 30px; white-space: pre-wrap; }
        .options-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px; }
        .option-btn { background: #f9fcff; border: 2px solid #d0ddea; border-radius: 20px; padding: 18px 28px; font-size: 1.15rem; font-weight: 500; color: #1a2c3f; text-align: left; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 18px; }
        .option-btn:hover:not(:disabled) { background: #e7f0fd; border-color: #2c7be5; transform: translateY(-2px); }
        .option-btn.correct { background: #d7f0e0; border-color: #1e8e5e; color: #0c4a2e; }
        .option-btn.wrong { background: #ffe5e5; border-color: #d43b3b; color: #7a1f1f; }
        .option-btn:disabled { cursor: default; opacity: 0.95; }
        .option-letter { font-weight: 700; background: #fff; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1e2b3c; flex-shrink: 0; }
        .option-btn.correct .option-letter { background: #1e8e5e; color: white; }
        .option-btn.wrong .option-letter { background: #d43b3b; color: white; }
        .feedback-area { background: #f3f7fe; border-radius: 18px; padding: 18px 24px; margin: 10px 0 20px; font-size: 1.15rem; color: #0e2b4a; display: flex; border-left: 6px solid #2c7be5; min-height: 60px; font-weight: 500; }
        .feedback-area.correct-feedback { background: #e6f7ef; border-left-color: #1e8e5e; color: #0b4b2e; }
        .feedback-area.wrong-feedback { background: #ffefef; border-left-color: #d43b3b; color: #7a1f1f; }
        .action-buttons { display: flex; gap: 16px; justify-content: flex-end; padding: 8px 40px 40px; }
        .btn { border: none; font-weight: 600; font-size: 1.2rem; padding: 16px 34px; border-radius: 40px; cursor: pointer; transition: 0.15s; }
        .btn-primary { background: #2c7be5; color: white; box-shadow: 0 8px 18px rgba(44,123,229,0.3); }
        .btn-primary:disabled { background: #b6c9e0; cursor: not-allowed; box-shadow: none; }
        .btn-outline { background: #fff; border: 2px solid #cbd8e9; color: #1e2b3c; }
        .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-screen { padding: 48px 40px; text-align: center; }
        .score-big { font-size: 4rem; font-weight: 800; color: #2c7be5; margin: 20px 0; }
        .score-detail { font-size: 1.3rem; color: #3d5068; margin-bottom: 20px; background: #f3f8ff; padding: 20px 30px; border-radius: 30px; display: inline-block; }
        .restart-btn { background: #1e2b3c; color: white; padding: 16px 48px; font-size: 1.2rem; border-radius: 40px; font-weight: 600; cursor: pointer; border: none; margin-top: 20px; }
        .hidden { display: none !important; }
        .subject-selector { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 24px 0; }
        .subject-btn { background: #f0f4fa; border: 2px solid #cbd8e9; border-radius: 30px; padding: 12px 28px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .subject-btn:hover { background: #e0ecff; border-color: #2c7be5; }
    </style>
</head>
<body>
<div class="map-container">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div id="subjectView">
        <div class="test-header"><span class="subject-badge">MAP 高分挑战</span><span class="question-counter">选择科目</span></div>
        <div class="question-panel" style="text-align: center;">
            <div style="font-size: 2rem; font-weight: 600; margin: 20px 0 10px; color: #0b1a2b;">🎯 自适应挑战 (400题/科)</div>
            <div style="font-size: 1.1rem; color: #3d5068; margin-bottom: 20px;">顶级难度题库 · 答对难度提升 · 答错难度下降</div>
            <div class="subject-selector" id="subjectSelector"></div>
            <div style="font-size: 0.9rem; color: #6a7f99; margin-top: 20px;">最终分数 0-350，由正确率和最终稳定难度共同决定</div>
        </div>
    </div>

    <div id="quizView" class="hidden">
        <div class="test-header">
            <span class="subject-badge" id="subjectBadge">Math</span>
            <span class="question-counter" id="questionCounter">Question 1 / 40</span>
            <span class="difficulty-indicator" id="difficultyDisplay">难度 5</span>
        </div>
        <div class="question-panel">
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsContainer"></div>
            <div class="feedback-area" id="feedbackArea">选择一个答案</div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-outline" id="skipBtn">跳过</button>
            <button class="btn btn-primary" id="nextBtn" disabled>下一题</button>
        </div>
    </div>

    <div id="resultView" class="hidden">
        <div class="result-screen">
            <h2>✅ 测试完成</h2>
            <div class="score-big" id="finalScore">0</div>
            <div class="score-detail" id="finalDetail">0 / 40 正确</div>
            <div style="margin-bottom: 30px; font-size: 1.1rem; color: #1e2b3c;" id="difficultyResult"></div>
            <button class="restart-btn" id="restartBtn">返回科目选择</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 极简高效题库生成器 (每科 400 题, 难度 1-10, 每个难度 40 题)
    // ==========================================
    function generateAdvancedBank() {
        const bank = { Math: [], 'Language Usage': [], Reading: [], Science: [] };
        const shuffle = (a) => a.sort(() => Math.random() - 0.5);

        // 核心母题（每个难度2道，通过复制和变异衍生出40道）
        const mathBase = [
            {q:'Solve for x: 3x² - 12 = 0 (x>0)',o:['2','3','4','6'],a:0,d:1},{q:'If f(x)=2x+3, what is f⁻¹(7)?',o:['2','4','5','10'],a:0,d:1},
            {q:'What is the slope perpendicular to y=-2x+5?',o:['-2','-1/2','1/2','2'],a:2,d:2},{q:'Factor: x²-5x+6',o:['(x-2)(x-3)','(x+2)(x+3)','(x-1)(x-6)','(x+1)(x-6)'],a:0,d:2},
            {q:'What is the value of log₂(32)?',o:['3','4','5','6'],a:2,d:3},{q:'The sum of three consecutive even integers is 84. What is the largest?',o:['26','28','30','32'],a:2,d:3},
            {q:'Simplify: (x³y²)² / (x²y³)',o:['x⁴y','x⁴/y','x⁸y','x⁴y⁷'],a:0,d:4},{q:'Right triangle legs 5 and 12. What is sin(θ) opposite to 5?',o:['5/12','5/13','12/13','13/12'],a:1,d:4},
            {q:'If 2^(x+1)=16, what is x?',o:['2','3','4','5'],a:1,d:5},{q:'Vertex of parabola y=2(x-3)²-4?',o:['(3,-4)','(-3,-4)','(3,4)','(-3,4)'],a:0,d:5},
            {q:'Solve for x: |2x - 5| = 9',o:['x=7 or -2','x=2 or -7','x=7','x=-2'],a:0,d:6},{q:'10th term of sequence: 3,7,11,15...?',o:['37','39','41','43'],a:1,d:6},
            {q:'Simplify: (√3+√2)(√3-√2)',o:['1','5','√6','2√6'],a:0,d:7},{q:'Probability of drawing two red cards consecutively?',o:['1/4','1/17','25/102','26/51'],a:2,d:7},
            {q:'Domain of f(x) = √(x-2)/(x-5)?',o:['[2,5)∪(5,∞)','(2,∞)','[2,∞)','(5,∞)'],a:0,d:8},{q:'If cos(x)=3/5, what is sin(2x)?',o:['24/25','12/25','7/25','-24/25'],a:0,d:8},
            {q:'Evaluate: lim(x→0) sin(3x)/5x',o:['3/5','5/3','1','0'],a:0,d:9},{q:'Determinant of [[2,1],[3,4]]?',o:['5','8','10','11'],a:0,d:9},
            {q:'Derivative of x²e^x?',o:['2xe^x','xe^x','e^x(x²+2x)','e^x(x²+1)'],a:2,d:10},{q:'Integral of 3x²+2x dx?',o:['x³+x²+C','3x³+x²+C','x³+2x²+C','6x+2+C'],a:0,d:10}
        ];
        for(let d=1; d<=10; d++) {
            let pool = mathBase.filter(x=>x.d===d);
            for(let i=0; i<40; i++) {
                let b = pool[i%pool.length];
                bank.Math.push({ subject:'Math', question: b.q.replace(/\d+/g, m=>parseInt(m)+i%5), options:[...b.o], answerIndex:b.a, difficulty:d });
            }
        }

        const langBase = [
            {q:'Error in: "Neither of the boys were ready."',o:['Neither','of','were','ready'],a:2,d:1},{q:'Meaning of "bite the bullet"?',o:['Eat quickly','Endure pain','Act aggressively','Avoid problem'],a:1,d:1},
            {q:'Correct word: The effect was ______.',o:['profound','profoundly','profounding','profoundness'],a:0,d:2},{q:'Semicolon used correctly?',o:['dog; and cat','dog; it is','dog, it; is','have; a dog'],a:1,d:2},
            {q:'Definition of "ubiquitous"?',o:['Rare','Everywhere','Hidden','Ancient'],a:1,d:3},{q:'Clause type: "Because it rained, we stayed."',o:['Independent','Dependent','Relative','Noun'],a:1,d:3},
            {q:'Correct pronoun: Between you and ______.',o:['I','me','myself','we'],a:1,d:4},{q:'Literary device: "The wind whispered"',o:['Simile','Metaphor','Personification','Hyperbole'],a:2,d:4},
            {q:'Synonym for "ephemeral"?',o:['Eternal','Fleeting','Solid','Mysterious'],a:1,d:5},{q:'Fix dangling modifier: "Walking down the street, the trees were beautiful."',o:['I saw beautiful trees.','Trees walking','street beautiful trees','trees had walking'],a:0,d:5},
            {q:'Subjunctive in: "If I were you..."',o:['were','I','would','go'],a:0,d:6},{q:'Tone: "masterpiece of obfuscation and evasion"',o:['Admiring','Critical','Humorous','Neutral'],a:1,d:6},
            {q:'Correct word: immediate ______ on patient.',o:['affect','effect','effective','affective'],a:1,d:7},{q:'Function of "however" in "plan, however, failed"',o:['Conjunction','Conjunctive adverb','Preposition','Interjection'],a:1,d:7},
            {q:'Passive voice sentence?',o:['Storm destroyed house','House was destroyed by storm','Storm destroying house','Storm will destroy house'],a:1,d:8},{q:'Meaning of "ostensibly"?',o:['Actually','Apparently','Definitely','Secretly'],a:1,d:8},
            {q:'Rhetorical device: "I have a dream..." repetition',o:['Anaphora','Epistrophe','Chiasmus','Zeugma'],a:0,d:9},{q:'Plural of "criterion"?',o:['criterions','criterias','criteria','criterion'],a:2,d:9},
            {q:'"Only after rain stopped did we go" - inversion type?',o:['Subject-verb','Negative','Locative','Conditional'],a:1,d:10},{q:'Argument so ______ no flaw found.',o:['tenuous','cogent','redundant','ambiguous'],a:1,d:10}
        ];
        for(let d=1; d<=10; d++) {
            let pool = langBase.filter(x=>x.d===d);
            for(let i=0; i<40; i++) {
                let b = pool[i%pool.length];
                bank['Language Usage'].push({ subject:'Language Usage', question: b.q.replace('ubiquitous', ['ubiquitous','cogent','ephemeral'][i%3]), options:[...b.o], answerIndex:b.a, difficulty:d });
            }
        }

        const readBase = [
            {p:'Algorithmic echo chambers reinforce beliefs, fueling misinformation.',q:'Main cause of misinformation?',o:['Censorship','Echo chambers','Education','News'],a:1,d:1},
            {p:'Telegraph compressed time and space, allowing information to travel faster.',q:'Main effect of telegraph?',o:['Increased trade','Faster information travel','Unification','Military'],a:1,d:1},
            {p:'Cautious optimism: acknowledging risks, but technological solutions within reach.',q:'Author tone?',o:['Pessimistic','Cautiously optimistic','Indifferent','Enthusiastic'],a:1,d:2},
            {p:'Internal monologue reveals deep-seated fear of failure, which paralyzes him.',q:'Monologue reveals?',o:['Courage','Fear of failure','Anger','Joy'],a:1,d:2},
            {p:'Replication crisis in psychology casts doubt on reliability of classic studies.',q:'Main point?',o:['Psychology fake','Crisis undermines reliability','Results wrong','Studies reliable'],a:1,d:3},
            {p:'Imagery of decay and ruin symbolizes the decline of the empire.',q:'Imagery symbolizes?',o:['Growth','Decline of empire','Beauty','War'],a:1,d:3},
            {p:'Multiplier effect: increased spending led to higher income, leading to further spending.',q:'Multiplier effect?',o:['Decreased spending','Income leading to more spending','Reduced activity','Intervention'],a:1,d:4},
            {p:'Satirical tone critiques the absurdity of bureaucratic inefficiency.',q:'Why use satire?',o:['Entertain','Critique bureaucracy','Praise efficiency','Describe nature'],a:1,d:4},
            {p:'Penicillin discovered serendipitously; Fleming noticed mold killing bacteria by accident.',q:'How discovered?',o:['By design','By accident','Luck and design','Magic'],a:1,d:5},
            {p:'Narrative shifts between past and present, mirroring protagonist\'s fractured memory.',q:'Why shift timelines?',o:['To confuse','Mirror fractured memory','Show action','Add humor'],a:1,d:5},
            {p:'Cognitive dissonance: mental discomfort from holding contradictory beliefs.',q:'Cognitive dissonance?',o:['Comfort','Discomfort from contradictions','Learning','Memory technique'],a:1,d:6},
            {p:'Globalization has homogenized culture, erasing unique local traditions.',q:'Author argument?',o:['Preserves culture','Homogenizes culture','Is good','Traditions strong'],a:1,d:6},
            {p:'Iambic pentameter, ABAB CDCD EFEF GG is typical of a Shakespearean sonnet.',q:'Sonnet type?',o:['Petrarchan','Shakespearean','Spenserian','Miltonic'],a:1,d:7},
            {p:'Methodology flawed: lacked a control group, making causal inferences impossible.',q:'Why impossible?',o:['Variables','Lack of control group','Sample size','Bad data'],a:1,d:7},
            {p:'Epiphany: realizes obsession with wealth has alienated family.',q:'Epiphany?',o:['Wealth good','Wealth alienated family','Family unimportant','Work harder'],a:1,d:8},
            {p:'Stream-of-consciousness depicts chaotic inner thoughts.',q:'Technique?',o:['Dialogue','Stream of consciousness','Flashback','Foreshadowing'],a:1,d:8},
            {p:'Historical context is Industrial Revolution, bringing social and economic upheaval.',q:'Context?',o:['Renaissance','Industrial Revolution','WWI','Cold War'],a:1,d:9},
            {p:'Teleological argument explains phenomena by purpose or end goal.',q:'Argument type?',o:['Causal','Teleological','Empirical','Logical'],a:1,d:9},
            {p:'Unreliable narration forces reader to question the truth.',q:'Effect?',o:['Trust narrator','Question truth','Enjoy story','Ignore plot'],a:1,d:10},
            {p:'Metafictional elements break fourth wall, reminding reader it is fiction.',q:'Metafiction?',o:['Fiction about fiction','Historical','Sci-fi','Realistic'],a:0,d:10}
        ];
        for(let d=1; d<=10; d++) {
            let pool = readBase.filter(x=>x.d===d);
            for(let i=0; i<40; i++) {
                let b = pool[i%pool.length];
                bank.Reading.push({ subject:'Reading', question:`Passage: ${b.p}\nQ: ${b.q}`, options:[...b.o], answerIndex:b.a, difficulty:d });
            }
        }

        const sciBase = [
            {q:'Primary function of mitochondria?',o:['Protein synthesis','ATP production','Lipid storage','DNA replication'],a:1,d:1},{q:'Newton\'s second law?',o:['F=ma','E=mc²','PV=nRT','v=d/t'],a:0,d:1},
            {q:'Chemical formula for table salt?',o:['NaCl','KCl','CaCl₂','MgCl₂'],a:0,d:2},{q:'Powerhouse of cell?',o:['Nucleus','Mitochondria','Ribosome','Golgi'],a:1,d:2},
            {q:'Process by which plants make food?',o:['Respiration','Photosynthesis','Transpiration','Digestion'],a:1,d:3},{q:'Most abundant gas in atmosphere?',o:['Oxygen','Nitrogen','CO2','Argon'],a:1,d:3},
            {q:'Theory of relativity proposed by?',o:['Newton','Einstein','Galileo','Bohr'],a:1,d:4},{q:'pH of neutral solution?',o:['0','7','14','1'],a:1,d:4},
            {q:'Function of DNA?',o:['Energy','Genetic information','Catalysis','Transport'],a:1,d:5},{q:'Speed of light in vacuum?',o:['3×10⁸ m/s','3×10⁶ m/s','3×10¹⁰ m/s','3×10⁵ m/s'],a:0,d:5},
            {q:'First law of thermodynamics?',o:['Energy conserved','Entropy increases','F=ma','Action-reaction'],a:0,d:6},{q:'Role of enzymes?',o:['Increase activation','Decrease activation','Provide energy','Consume energy'],a:1,d:6},
            {q:'Difference between mitosis and meiosis?',o:['Mitosis 4 cells','Mitosis 2 identical, meiosis 4 different','Both 2 cells','Mitosis sex cells'],a:1,d:7},{q:'Heisenberg uncertainty principle?',o:['Know both exactly','Cannot know both exactly','Energy quantized','Light wave'],a:1,d:7},
            {q:'Function of ribosome?',o:['Lipid synthesis','Protein synthesis','Carb synthesis','DNA replication'],a:1,d:8},{q:'Greenhouse effect?',o:['Cooling','Trapping heat','Ozone depletion','Acid rain'],a:1,d:8},
            {q:'Ionic vs covalent bond?',o:['Ionic shares','Ionic transfers, covalent shares','Both share','Both transfer'],a:1,d:9},{q:'Doppler effect?',o:['Frequency change','Amplitude change','Wavelength change','Speed change'],a:0,d:9},
            {q:'Role of ATP synthase?',o:['Break glucose','Produce ATP','Store oxygen','Transport electrons'],a:1,d:10},{q:'Pauli exclusion principle?',o:['No same quantum numbers','Electrons orbit','Energy quantized','Light particle'],a:0,d:10}
        ];
        for(let d=1; d<=10; d++) {
            let pool = sciBase.filter(x=>x.d===d);
            for(let i=0; i<40; i++) {
                let b = pool[i%pool.length];
                bank.Science.push({ subject:'Science', question: b.q, options:[...b.o], answerIndex:b.a, difficulty:d });
            }
        }

        Object.keys(bank).forEach(sub => bank[sub] = shuffle(bank[sub]));
        return bank;
    }

    const questionBank = generateAdvancedBank();
    
    // ==========================================
    // 游戏状态与逻辑
    // ==========================================
    let currentSubject = 'Math', currentQuestion = null, currentIndex = 0;
    let currentDifficulty = 5, correctCount = 0, usedQuestions = [];
    const TOTAL = 40;

    const subjectView = document.getElementById('subjectView'), quizView = document.getElementById('quizView'), resultView = document.getElementById('resultView');
    const subjectSelector = document.getElementById('subjectSelector'), subjectBadge = document.getElementById('subjectBadge');
    const questionCounter = document.getElementById('questionCounter'), difficultyDisplay = document.getElementById('difficultyDisplay');
    const questionText = document.getElementById('questionText'), optionsContainer = document.getElementById('optionsContainer');
    const feedbackArea = document.getElementById('feedbackArea'), nextBtn = document.getElementById('nextBtn'), skipBtn = document.getElementById('skipBtn');
    const progressFill = document.getElementById('progressFill'), finalScore = document.getElementById('finalScore'), finalDetail = document.getElementById('finalDetail');
    const difficultyResult = document.getElementById('difficultyResult'), restartBtn = document.getElementById('restartBtn');

    function initSubjectView() {
        subjectView.classList.remove('hidden'); quizView.classList.add('hidden'); resultView.classList.add('hidden');
        progressFill.style.width = '0%';
        subjectSelector.innerHTML = '';
        ['Math', 'Language Usage', 'Reading', 'Science'].forEach(sub => {
            const btn = document.createElement('button'); btn.className = 'subject-btn'; btn.textContent = sub;
            btn.onclick = () => startQuiz(sub); subjectSelector.appendChild(btn);
        });
    }

    function startQuiz(subject) {
        currentSubject = subject; subjectView.classList.add('hidden'); quizView.classList.remove('hidden'); resultView.classList.add('hidden');
        currentIndex = 0; currentDifficulty = 5; correctCount = 0; usedQuestions = [];
        loadNextQuestion();
    }

    function pickQuestion(diff) {
        const bank = questionBank[currentSubject];
        let candidates = bank.filter(q => !usedQuestions.includes(q) && q.difficulty === diff);
        if (candidates.length === 0) {
            let minDiff = 100;
            bank.forEach(q => { if (!usedQuestions.includes(q)) minDiff = Math.min(minDiff, Math.abs(q.difficulty - diff)); });
            candidates = bank.filter(q => !usedQuestions.includes(q) && Math.abs(q.difficulty - diff) === minDiff);
        }
        return candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : bank.find(q => !usedQuestions.includes(q));
    }

    function loadNextQuestion() {
        if (currentIndex >= TOTAL) { showResult(); return; }
        const q = pickQuestion(currentDifficulty);
        if (!q) { showResult(); return; }
        currentQuestion = q; usedQuestions.push(q);

        subjectBadge.textContent = currentSubject;
        questionCounter.textContent = `Question ${currentIndex + 1} / ${TOTAL}`;
        difficultyDisplay.textContent = `难度 ${currentDifficulty}`;
        questionText.textContent = q.question;
        
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button'); btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span>`;
            btn.onclick = () => handleAnswer(idx); optionsContainer.appendChild(btn);
        });

        feedbackArea.textContent = '选择一个答案'; feedbackArea.className = 'feedback-area';
        nextBtn.disabled = true; skipBtn.disabled = false;
        nextBtn.textContent = (currentIndex === TOTAL - 1) ? '完成测试' : '下一题';
        progressFill.style.width = `${(currentIndex / TOTAL) * 100}%`;
    }

    function handleAnswer(selectedIdx) {
        if (!nextBtn.disabled) return; 
        const isCorrect = (selectedIdx === currentQuestion.answerIndex);
        
        document.querySelectorAll('.option-btn').forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === selectedIdx) btn.classList.add(isCorrect ? 'correct' : 'wrong');
            if (idx === currentQuestion.answerIndex && idx !== selectedIdx) btn.classList.add('correct');
        });

        if (isCorrect) {
            feedbackArea.textContent = '✅ 正确！'; feedbackArea.className = 'feedback-area correct-feedback';
            correctCount++; currentDifficulty = Math.min(10, currentDifficulty + 1);
        } else {
            feedbackArea.textContent = `❌ 错误。正确答案: ${['A','B','C','D'][currentQuestion.answerIndex]}. ${currentQuestion.options[currentQuestion.answerIndex]}`; 
            feedbackArea.className = 'feedback-area wrong-feedback';
            currentDifficulty = Math.max(1, currentDifficulty - 1);
        }
        
        difficultyDisplay.textContent = `难度 ${currentDifficulty}`;
        nextBtn.disabled = false; skipBtn.disabled = true;
    }

    skipBtn.onclick = () => {
        if (skipBtn.disabled) return;
        const q = currentQuestion;
        document.querySelectorAll('.option-btn').forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.answerIndex) btn.classList.add('correct');
        });
        feedbackArea.textContent = `⏭️ 已跳过。正确答案: ${['A','B','C','D'][q.answerIndex]}. ${q.options[q.answerIndex]}`;
        feedbackArea.className = 'feedback-area';
        currentDifficulty = Math.max(1, currentDifficulty - 1);
        difficultyDisplay.textContent = `难度 ${currentDifficulty}`;
        nextBtn.disabled = false; skipBtn.disabled = true;
    };

    nextBtn.onclick = () => { currentIndex++; loadNextQuestion(); };

    function showResult() {
        quizView.classList.add('hidden'); resultView.classList.remove('hidden');
        progressFill.style.width = '100%';
        
        const accuracy = correctCount / TOTAL;
        const difficultyScore = (currentDifficulty / 10);
        let finalScoreVal = Math.round((accuracy * 210) + (difficultyScore * 140)); 
        finalScoreVal = Math.min(350, finalScoreVal); 
        
        finalScore.textContent = finalScoreVal;
        finalDetail.textContent = `正确 ${correctCount} / ${TOTAL} 题 · 最终难度 ${currentDifficulty}/10`;
        difficultyResult.textContent = `得分配比：正确率得分 (${Math.round(accuracy * 210)}) + 难度得分 (${Math.round(difficultyScore * 140)})`;
    }

    restartBtn.onclick = initSubjectView;
    initSubjectView();
</script>
</body>
</html>
